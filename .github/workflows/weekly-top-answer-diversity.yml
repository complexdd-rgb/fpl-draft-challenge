name: Weekly top-answer diversity patch

on:
  push:
    branches:
      - reduce-weekly-top-answer-repeats
    paths:
      - scripts/apply-weekly-top-answer-diversity.mjs
      - scripts/verify-weekly-top-answer-diversity.mjs
      - js/admin-batch-calendar.js
      - .github/workflows/weekly-top-answer-diversity.yml

permissions:
  contents: write

jobs:
  apply-patch:
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: reduce-weekly-top-answer-repeats
          fetch-depth: 0

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Apply weekly diversity patch
        run: node scripts/apply-weekly-top-answer-diversity.mjs

      - name: Verify weekly diversity policy
        run: node scripts/verify-weekly-top-answer-diversity.mjs

      - name: Check generated JavaScript
        run: |
          node --check js/admin-batch-calendar.js
          git diff --check

      - name: Commit generated patch
        run: |
          if git diff --quiet -- js/admin-batch-calendar.js; then
            echo "Generator already patched."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add js/admin-batch-calendar.js
          git commit -m "Reduce repeated weekly top answers"
          git push
