name: Temporary Morph saved-source audit

on:
  push:
    branches:
      - tmp/2010-11-unresolved-frontier-20260823

permissions:
  contents: write

jobs:
  audit:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: tmp/2010-11-unresolved-frontier-20260823

      - name: Fetch full preserved FPL fixture-history CSV
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL https://raw.githubusercontent.com/BrenPatF/item_category_optimization_oracle/af18698aad5a5084aa9e11709900e1571b04b03b/fantasy_premier_league_player_stats.csv -o /tmp/morph.csv
          test "$(wc -c </tmp/morph.csv)" -gt 2000000

      - name: Split archive into readable player chunks and build index
        shell: bash
        run: |
          set -euo pipefail
          rm -rf tmp/morph-saved-source-audit
          mkdir -p tmp/morph-saved-source-audit/chunks
          python - <<'PY'
          import csv, json, unicodedata
          from collections import defaultdict
          from pathlib import Path

          src=Path('/tmp/morph.csv')
          out=Path('tmp/morph-saved-source-audit')
          with src.open(encoding='utf-8-sig',newline='') as f:
              rd=csv.DictReader(f); headers=rd.fieldnames; rows=list(rd)

          def get(r,*names):
              for n in names:
                  if n in r: return r.get(n,'')
              return ''
          def asint(v):
              try:return int(float(str(v or 0).strip()))
              except:return 0
          def full(r):
              return ' '.join(x for x in [get(r,'first_name','First Name'),get(r,'last_name','Last Name','Player')] if x).strip()
          def team(r): return get(r,'team_name_1','team_name','Team')
          def initial(name):
              s=unicodedata.normalize('NFKD',name or '')
              s=''.join(c for c in s if not unicodedata.combining(c)).strip().upper()
              c=s[0] if s else '_'; return c if 'A'<=c<='Z' else '_'

          grouped=defaultdict(list)
          for r in rows: grouped[(full(r),team(r))].append(r)
          idx=[]
          for (name,club),rr in grouped.items():
              weeks=sorted({asint(get(x,'week','Week')) for x in rr})
              idx.append({'player':name,'team':club,'rows':len(rr),'minutes_sum':sum(asint(get(x,'minutes_played','Minutes')) for x in rr),'assists_sum':sum(asint(get(x,'assists','Assists')) for x in rr),'points_sum':sum(asint(get(x,'points','FPL Points')) for x in rr),'weeks':' '.join(map(str,weeks)),'dates':' | '.join(sorted({get(x,'date','Date') for x in rr}))})
          idx.sort(key=lambda x:(x['player'].lower(),x['team'].lower()))
          with (out/'player_team_index.csv').open('w',encoding='utf-8-sig',newline='') as f:
              fields=list(idx[0]); w=csv.DictWriter(f,fieldnames=fields); w.writeheader(); w.writerows(idx)

          buckets=defaultdict(list)
          for r in rows: buckets[initial(full(r))].append(r)
          for key,rr in buckets.items():
              with (out/'chunks'/f'{key}.csv').open('w',encoding='utf-8-sig',newline='') as f:
                  w=csv.DictWriter(f,fieldnames=headers); w.writeheader(); w.writerows(rr)

          audit={'rows':len(rows),'headers':headers,'player_team_groups':len(idx),'chunk_counts':{k:len(v) for k,v in sorted(buckets.items())},'warning':'Original scraper key was player-slot ID + gameweek without season. This is a mixed preserved-row archive; season totals require positive 2010/11 identification/completeness checks.'}
          (out/'audit.json').write_text(json.dumps(audit,indent=2)+'\n',encoding='utf-8')
          PY

      - name: Commit compact readable audit
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add tmp/morph-saved-source-audit
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'tmp: materialise Morph saved-source audit'
          git push origin HEAD:tmp/2010-11-unresolved-frontier-20260823
