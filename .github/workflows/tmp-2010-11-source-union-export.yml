name: Temporary 2010-11 official 314 export

on:
  push:
    branches:
      - tmp/2010-11-unresolved-frontier-20260823

permissions:
  contents: read

jobs:
  export:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: tmp/2010-11-unresolved-frontier-20260823

      - name: Fetch frozen official FPL source
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/fpl2010-official
          mkdir -p /tmp/fpl2010-official
          git -C /tmp/fpl2010-official init -q
          git -C /tmp/fpl2010-official remote add origin https://github.com/elie222/Fantasy-Football-AI.git
          git -C /tmp/fpl2010-official sparse-checkout init --cone
          git -C /tmp/fpl2010-official sparse-checkout set 20_5_2013
          git -C /tmp/fpl2010-official fetch -q --depth 1 --filter=blob:none origin a607e4eb7a3002432cc39b20e0650af33dc334da
          git -C /tmp/fpl2010-official checkout -q FETCH_HEAD

      - name: Export 314 positive-minute 2010-11 histories
        shell: bash
        run: |
          set -euo pipefail
          rm -rf tmp/2010-11-official-output
          mkdir -p tmp/2010-11-official-output
          python - <<'PY'
          import csv, json
          from pathlib import Path

          src = Path('/tmp/fpl2010-official/20_5_2013')
          out = Path('tmp/2010-11-official-output')
          commit = 'a607e4eb7a3002432cc39b20e0650af33dc334da'

          aliases = {
              'Vassiriki Diaby':'Abou Diaby','Carlos Alberto Vela':'Carlos Vela','Josh McEachran':'Joshua McEachran',
              'Nascimento Ramires':'Ramires','Mikel':'Mikel John Obi','Johnny Heitinga':'John Heitinga',
              'Phil Jagielka':'Philip Jagielka','Mousa Dembele':'Moussa Dembele','Jose Reina':'Pepe Reina',
              'Sanchez Jose Enrique':'Jose Enrique','Leiva Lucas':'Lucas Leiva','Antonio Valencia':'Luis Antonio Valencia',
              'Luis Nani':'Nani','Oliveira Anderson':'Anderson','Rob Green':'Robert Green','Phil Bardsley':'Philip Bardsley',
              'Raniere Sandro':'Sandro','Dos Santos Giovani':'Giovani Dos Santos','Gonzalo Jara Reyes':'Gonzalo Jara',
              'Youssouf Mulumbu':'Youssuf Mulumbu','Michael Pollitt':'Mike Pollitt','Adrian Lopez':'Piscu',
              'David Hoilett':'Junior Hoilett','Matthew Jarvis':'Matt Jarvis','Steven Nzonzi':"Steven N'Zonzi",
              'Jordon Mutch':'Jordan Mutch','Mame Biram Diouf':'Mame Diouf','Cesc Fàbregas':'Francesc Fabregas',
              'Jonathan Hogg':'Jonathon Hogg'
          }

          def n(v):
              try: return int(float(v or 0))
              except: return 0

          rows=[]
          for p in sorted((x for x in src.iterdir() if x.name.isdigit()), key=lambda x:int(x.name)):
              obj=json.loads(p.read_text(encoding='utf-8'))
              hist=[r for r in obj.get('season_history',[]) if r and r[0]=='2010/11' and n(r[1])>0]
              if not hist: continue
              r=hist[0]
              recovered=' '.join(x for x in [obj.get('first_name',''),obj.get('second_name','')] if x).strip()
              rows.append({
                  'player': aliases.get(recovered,recovered),
                  'recovered_name': recovered,
                  'source_identity_code': str(obj.get('code') or ''),
                  'official_archive_id': p.name,
                  'minutes':n(r[1]),'goals':n(r[2]),'assists':n(r[3]),'clean_sheets':n(r[4]),
                  'goals_conceded':n(r[5]),'own_goals':n(r[6]),'penalties_saved':n(r[7]),
                  'penalties_missed':n(r[8]),'yellow_cards':n(r[9]),'red_cards':n(r[10]),
                  'saves':n(r[11]),'bonus':n(r[12]),'start_price_m':'',
                  'end_price_m':float(r[14])/10 if r[14] not in (None,'') else '',
                  'total_points':n(r[15]),
                  'fpl_native_source_class':'OFFICIAL MAY-2013 API',
                  'source_reference':f'element {p.name}',
                  'source_url':f'https://github.com/elie222/Fantasy-Football-AI/blob/{commit}/20_5_2013/{p.name}',
                  'recovery_note':'Exact 2010/11 season_history from frozen May-2013 official FPL archive.'
              })
          if len(rows)!=314:
              raise RuntimeError(f'official histories {len(rows)} != 314')
          fields=list(rows[0].keys())
          with (out/'official_314.csv').open('w',encoding='utf-8-sig',newline='') as f:
              w=csv.DictWriter(f,fieldnames=fields); w.writeheader(); w.writerows(rows)
          audit={'official_positive_histories':len(rows),'source_commit':commit,'alias_map_count':len(aliases)}
          (out/'audit.json').write_text(json.dumps(audit,indent=2)+'\n',encoding='utf-8')
          print(json.dumps(audit,indent=2))
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: official-2010-11-314
          path: tmp/2010-11-official-output/
          retention-days: 2
