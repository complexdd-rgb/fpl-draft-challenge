name: Prompt Studio V4

on:
  pull_request:
    paths:
      - 'js/prompt-studio-v4-simple.js'
      - 'js/studio-bootstrap.js'
      - 'config/asset-manifest.json'
      - 'scripts/verify-prompt-studio-v4.mjs'
      - '.github/workflows/prompt-studio-v4.yml'
  push:
    branches:
      - 'redesign/prompt-studio-v4-*'
    paths:
      - 'js/prompt-studio-v4-simple.js'
      - 'js/studio-bootstrap.js'
      - 'config/asset-manifest.json'
      - 'scripts/verify-prompt-studio-v4.mjs'
      - '.github/workflows/prompt-studio-v4.yml'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify simple Prompt Studio policy
        run: node scripts/verify-prompt-studio-v4.mjs
      - name: Check JavaScript syntax
        run: |
          node --check js/prompt-studio-v4-simple.js
          node --check js/studio-bootstrap.js
          node --check scripts/verify-prompt-studio-v4.mjs
      - name: Reject whitespace errors
        run: git diff --check origin/main...HEAD
