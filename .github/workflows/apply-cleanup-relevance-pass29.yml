name: Apply cleanup relevance pass 29

on:
  push:
    branches:
      - cleanup-relevance-pass29
    paths:
      - 'scripts/apply-cleanup-relevance-pass29.mjs'
      - '.github/workflows/apply-cleanup-relevance-pass29.yml'

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: cleanup-relevance-pass29
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Apply semantic terminology cleanup
        run: node scripts/apply-cleanup-relevance-pass29.mjs

      - name: Verify production diff
        run: |
          set -euo pipefail
          ! grep -qE 'class="eyebrow">Step [0-9]+' admin.html
          ! grep -qE 'class="eyebrow">Step [0-9]+' fragments/admin-daily-workspace.html
          ! grep -q 'Challenge Studio · Phase 15' admin.html
          ! grep -q 'Generated by FPL Challenge Studio Phase 4' js/admin-core.js
          ! grep -q 'FPL Challenge Studio Phase 7' js/admin-core.js
          ! grep -q 'FPL Challenge Studio Phase 10' js/admin-core.js
          ! grep -q 'FPL Challenge Studio Phase 11' js/admin-core.js
          ! grep -q 'FPL CHALLENGE STUDIO PHASE 10' js/admin-core.js
          ! grep -q "Phase 7's older auditor" js/certification-approved-null-policy.js
          grep -q 'BEGIN admin-phase7.js' js/admin-core.js
          grep -q 'BEGIN admin-phase10.js' js/admin-core.js
          grep -q 'BEGIN admin-phase11.js' js/admin-core.js
          grep -q 'js/admin-core.js?v=19.0.2-semantic-copy' admin.html
          grep -q 'js/admin-stage-one.js?v=1.5.2-semantic-labels' admin.html
          grep -q '1.5.2-semantic-labels' config/asset-manifest.json
          grep -q '1.5.2-semantic-labels' js/asset-manifest.js
          node scripts/verify-native-daily-workspace.mjs
          node scripts/verify-native-validation-workspace.mjs
          git diff --check

      - name: Commit production cleanup
        run: |
          if git diff --quiet -- admin.html fragments/admin-daily-workspace.html js/admin-stage-one.js js/admin-core.js admin-base.css js/certification-approved-null-policy.js config/asset-manifest.json js/asset-manifest.js; then
            echo 'No production cleanup changes to commit.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add admin.html fragments/admin-daily-workspace.html js/admin-stage-one.js js/admin-core.js admin-base.css js/certification-approved-null-policy.js config/asset-manifest.json js/asset-manifest.js
          git commit -m 'Replace numbered Studio labels with semantic names'
          git push origin HEAD:cleanup-relevance-pass29
