name: Studio regression

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: write

jobs:
  studio-syntax:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Check Studio and live JavaScript syntax
        run: |
          node --check prompt-library.js
          node --check players-live.js
          node --check js/admin-core.js
          node --check js/admin-stage-one.js
          node --check js/admin-batch-calendar.js
          node --check js/admin-import-tools.js
          node --check js/prompt-studio-loader.js
          node --check js/career-shape-validation-bridge.js
          node --check js/admin-import-tools-base.js
          node --check js/admin-daily-publish.js
          node --check js/admin-daily-generator-guard.js
          node --check js/admin-studio-finish.js
          node --check js/validation-engine.js
          node --check js/validation-lab.js
          node --check js/leaderboard-config.js
          node --check js/live-feature-loader.js
          node --check js/studio-feature-loader.js
          node --check js/prompt-library-legacy-additions-20260814.js
          node --check js/leaderboard-client.js
          node --check js/leaderboard-team-view.js
          node --check js/leaderboard-ranking-rules.js
          node --check js/leaderboard-all-time.js
          node --check js/leaderboard-account.js
          node --check js/leaderboard-admin-status.js
          node --check js/player-profile.js
          node --check js/player-profile-cache.js
          node --check js/player-profile-core.js
          node --check js/results-v2.js
          node --check js/results-polish-v3.js
          node --check js/career-context.js
          node --check js/career-overlap-wording.js
          node --check js/prompt-four-star-enforcer.js
          node --check js/career-shape-rules.js
          node --check js/career-shape-studio.js
          node --check js/career-shape-unified-generator.js
          node --check js/career-shape-unified-fixes.js
          node --check js/career-shape-future-quality-guard.js
          node --check js/ui-cleanup.js
          node --check js/live-ui-bootstrap.js
          node --check js/retired-panel-compat.js
          node --check js/phase45-polish.js
          node --check js/season-select-performance.js
          node --check js/autocomplete-layer.js
          node --check js/visual-overhaul.js
          node --check js/visual-finishing.js
          node --check sw.js

  architecture-cleanup-pass2e-public-ui:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: studio-syntax
    runs-on: ubuntu-latest
    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Check migration syntax
        run: node --check scripts/architecture-cleanup-pass2e-public-ui.mjs

      - name: Apply public UI cleanup
        run: node scripts/architecture-cleanup-pass2e-public-ui.mjs

      - name: Verify cleaned public UI
        shell: bash
        run: |
          set -euo pipefail
          node --check js/give-up-gameplay.js
          node --check js/live-ui-bootstrap.js
          node --check js/ui-cleanup.js
          node --check js/live-feature-loader.js
          ! grep -q 'class="challenge-overview"' index.html
          ! grep -q 'id="liveXiPanel"' index.html
          ! grep -q 'id="phase45Achievements"' index.html
          grep -q 'id="phase45ExtendedStats"' index.html
          ! grep -q 'renderLivePitch' index.html
          ! grep -q 'renderAchievements' index.html
          ! grep -q 'removeLegacySelectionPanel' js/give-up-gameplay.js
          ! grep -q 'retired-panel-compat' js/ui-cleanup.js
          test ! -e js/retired-panel-compat.js
          grep -q 'loadPromptMissingFieldGuard' js/live-ui-bootstrap.js
          grep -q 'loadPresentationLayers' js/live-ui-bootstrap.js
          git diff --check

      - name: Restore permanent regression workflow
        shell: bash
        run: |
          set -euo pipefail
          rm -f scripts/architecture-cleanup-pass2e-public-ui.mjs
          git checkout a60e2419417498f848dca07dd89741b9e7844065 -- .github/workflows/studio-regression.yml
          node <<'NODE'
          const fs = require('node:fs');
          const path = '.github/workflows/studio-regression.yml';
          let workflow = fs.readFileSync(path, 'utf8');
          workflow = workflow.replace('          node --check js/retired-panel-compat.js\n', '');
          workflow = `${workflow.trimEnd()}\n\n      - name: Verify retired public UI is physically removed\n        shell: bash\n        run: |\n          set -euo pipefail\n          ! grep -q 'class=\"challenge-overview\"' index.html\n          ! grep -q 'id=\"liveXiPanel\"' index.html\n          ! grep -q 'id=\"phase45Achievements\"' index.html\n          grep -q 'id=\"phase45ExtendedStats\"' index.html\n          ! grep -q 'renderLivePitch' index.html\n          ! grep -q 'renderAchievements' index.html\n          ! grep -q 'removeLegacySelectionPanel' js/give-up-gameplay.js\n          ! grep -q 'retired-panel-compat' js/ui-cleanup.js\n          test ! -e js/retired-panel-compat.js\n          git diff --check\n`;
          fs.writeFileSync(path, workflow, 'utf8');
          NODE

      - name: Commit Architecture Cleanup Pass 2E public UI
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Architecture Cleanup Pass 2E — remove retired public UI source'
          git push origin HEAD:main
