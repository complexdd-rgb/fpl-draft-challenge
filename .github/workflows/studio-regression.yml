name: Studio regression

on:
  push:
    branches: [main]
  pull_request:

jobs:
  studio-syntax:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Check Studio and live JavaScript syntax
        run: |
          node --check prompt-library.js
          node --check players-live.js
          node --check js/admin-core.js
          node --check js/admin-stage-one.js
          node --check js/admin-batch-calendar.js
          node --check js/admin-import-tools.js
          node --check js/prompt-studio-loader.js
          node --check js/career-shape-validation-bridge.js
          node --check js/admin-import-tools-base.js
          node --check js/admin-daily-publish.js
          node --check js/admin-daily-generator-guard.js
          node --check js/admin-studio-finish.js
          node --check js/validation-engine.js
          node --check js/validation-lab.js
          node --check js/leaderboard-config.js
          node --check js/live-feature-loader.js
          node --check js/studio-feature-loader.js
          node --check js/prompt-library-legacy-additions-20260814.js
          node --check js/leaderboard-client.js
          node --check js/leaderboard-team-view.js
          node --check js/leaderboard-ranking-rules.js
          node --check js/leaderboard-all-time.js
          node --check js/leaderboard-account.js
          node --check js/leaderboard-admin-status.js
          node --check js/player-profile.js
          node --check js/player-profile-cache.js
          node --check js/player-profile-core.js
          node --check js/results-v2.js
          node --check js/results-polish-v3.js
          node --check js/career-context.js
          node --check js/career-overlap-wording.js
          node --check js/prompt-four-star-enforcer.js
          node --check js/career-shape-rules.js
          node --check js/career-shape-studio.js
          node --check js/career-shape-unified-generator.js
          node --check js/career-shape-unified-fixes.js
          node --check js/career-shape-future-quality-guard.js
          node --check js/ui-cleanup.js
          node --check js/live-ui-bootstrap.js
          node --check js/phase45-polish.js
          node --check js/season-select-performance.js
          node --check js/autocomplete-layer.js
          node --check js/visual-overhaul.js
          node --check js/visual-finishing.js
          node --check sw.js

      - name: Verify retired public UI is physically removed
        shell: bash
        run: |
          set -euo pipefail
          ! grep -q 'class="challenge-overview"' index.html
          ! grep -q 'id="liveXiPanel"' index.html
          ! grep -q 'id="phase45Achievements"' index.html
          grep -q 'id="phase45ExtendedStats"' index.html
          ! grep -q 'renderLivePitch' index.html
          ! grep -q 'renderAchievements' index.html
          ! grep -q 'removeLegacySelectionPanel' js/give-up-gameplay.js
          ! grep -q 'retired-panel-compat' js/ui-cleanup.js
          test ! -e js/retired-panel-compat.js
          git diff --check

      - name: Verify retired 2015/16 importer is physically removed
        shell: bash
        run: |
          set -euo pipefail
          ! grep -q 'id="legacyImportCentre"' admin.html
          ! grep -q 'fpl-history-2015-16.js' admin.html
          test ! -e data/fpl-history-2015-16.js
          ! grep -q 'BEGIN admin-phase12.js' js/admin-import-tools-base.js
          ! grep -q 'END admin-phase12.js' js/admin-import-tools-base.js
          grep -q 'BEGIN admin-phase15.js' js/admin-import-tools-base.js
          grep -q 'id="importCentreHeading"' admin.html
          grep -q 'id="identityConsolidationCentre"' admin.html
          node --check js/admin-import-tools-base.js
          git diff --check

      - name: Verify retired repair workspaces are physically removed
        shell: bash
        run: |
          set -euo pipefail
          ! grep -q 'id="databaseRepairPanel"' admin.html
          ! grep -q 'id="autoRepairHeading"' admin.html
          test "$(grep -c 'data-studio-retired="true"' admin.html)" -eq 1
          grep -q 'id="publishingPanel"' admin.html
          ! grep -q 'BEGIN admin-phase8.js' js/admin-core.js
          ! grep -q 'END admin-phase8.js' js/admin-core.js
          ! grep -q 'BEGIN admin-phase9.js' js/admin-core.js
          ! grep -q 'END admin-phase9.js' js/admin-core.js
          grep -q 'BEGIN admin-phase7.js' js/admin-core.js
          grep -q 'BEGIN admin-phase10.js' js/admin-core.js
          grep -q 'BEGIN admin-phase11.js' js/admin-core.js
          grep -q 'id="databaseAuditorPanel"' admin.html
          grep -q 'id="importCentreHeading"' admin.html
          grep -q 'id="identityConsolidationCentre"' admin.html
          node --check js/admin-core.js
          git diff --check
