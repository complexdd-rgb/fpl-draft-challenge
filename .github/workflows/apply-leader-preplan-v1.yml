name: Apply leader preplan v1

on:
  push:
    branches:
      - daily-leader-preplan-v1
    paths:
      - 'scripts/apply-leader-preplan-*.py'
      - '.github/workflows/apply-leader-preplan-v1.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply leader preplanner
        run: |
          python scripts/apply-leader-preplan-v1.py
          python scripts/apply-leader-preplan-fix-v1.py
      - name: Refresh asset wiring
        run: |
          node scripts/build-asset-manifest-runtime.mjs
          node scripts/build-studio-cache-tags.mjs
      - name: Verify targeted boundaries
        run: |
          node --check js/admin-batch-calendar.js
          node scripts/verify-weekly-top-answer-diversity.mjs
          node scripts/verify-weekly-certified-snapshot-race.mjs
          node scripts/verify-daily-semantic-diversity-v1.mjs
          node scripts/verify-prompt-studio-clean-reset.mjs
          node scripts/verify-all-season-certification-gate.mjs
          git diff --check
      - name: Commit production changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add admin.html config/asset-manifest.json js/admin-batch-calendar.js js/asset-manifest.js scripts/verify-weekly-top-answer-diversity.mjs scripts/verify-prompt-studio-clean-reset.mjs
          if git diff --cached --quiet; then
            echo 'No production changes to commit.'
          else
            git commit -m 'Pre-plan weekly top-answer leader days'
            git push origin HEAD:daily-leader-preplan-v1
          fi
