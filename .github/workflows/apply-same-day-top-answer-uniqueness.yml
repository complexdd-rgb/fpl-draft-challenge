name: Apply same-day top-answer uniqueness

on:
  push:
    branches:
      - 'feature/same-day-top-answer-uniqueness'
    paths:
      - '.github/workflows/apply-same-day-top-answer-uniqueness.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply top-answer uniqueness policy
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(text, old, new, label):
              if old not in text:
                  raise SystemExit(f'{label} anchor not found')
              return text.replace(old, new, 1)

          # Weekly reservoir guard.
          p = Path('js/admin-daily-generator-guard.js')
          s = p.read_text()
          s = replace_once(s, 'saved-library generation guard v2.5.3.', 'saved-library generation guard v2.6.0.', 'guard header')
          s = replace_once(s, 'const VERSION = "2.5.3";', 'const VERSION = "2.6.0";', 'guard version')
          s = replace_once(
              s,
              '  const NATIONALITY_WEEKLY_TARGET = DAYS_IN_BATCH;\n  const SEMANTIC_WAIT_MS = 10000;',
              '  const NATIONALITY_WEEKLY_TARGET = DAYS_IN_BATCH;\n  const EXCLUDE_TOP_RESULT_WEEKLY_MIN = 4;\n  const WEEKLY_LEADER_PREFERRED_PROMPT_CAP = 2;\n  const WEEKLY_LEADER_FALLBACK_PROMPT_CAP = 3;\n  const SEMANTIC_WAIT_MS = 10000;',
              'guard diversity constants'
          )
          s = replace_once(
              s,
              '    for (let index = 0; index < left; index += 1) targets[remainders[index % remainders.length].family] += 1;\n    return targets;',
              '''    for (let index = 0; index < left; index += 1) targets[remainders[index % remainders.length].family] += 1;\n\n    // Exclude Top Result is a deliberate diversity relief family, not just a tiny proportional\n    // family. Keep a small weekly floor so common superstar leaders can be actively displaced\n    // while retaining at least one prompt from every other non-nationality family.\n    if (Object.hasOwn(targets, "exclude-top-result") && targets["exclude-top-result"] < EXCLUDE_TOP_RESULT_WEEKLY_MIN) {\n      let needed = EXCLUDE_TOP_RESULT_WEEKLY_MIN - targets["exclude-top-result"];\n      while (needed > 0) {\n        const donor = others\n          .filter(row => row.family !== "exclude-top-result" && Number(targets[row.family] || 0) > 1)\n          .sort((leftRow, rightRow) =>\n            Number(targets[rightRow.family] || 0) - Number(targets[leftRow.family] || 0)\n            || Number(rightRow.total || 0) - Number(leftRow.total || 0)\n            || String(leftRow.family).localeCompare(String(rightRow.family))\n          )[0];\n        if (!donor) break;\n        targets[donor.family] -= 1;\n        targets["exclude-top-result"] += 1;\n        needed -= 1;\n      }\n    }\n    return targets;''',
              'exclude family floor'
          )
          s = replace_once(
              s,
              '  function promptTopAnswerKey(prompt) {\n    return String(promptTopAnswer(prompt)?.playerId || "");\n  }',
              '''  function promptTopAnswerKey(prompt) {\n    return String(promptTopAnswer(prompt)?.playerId || "");\n  }\n\n  function excludedTopPlayerId(prompt) {\n    if (String(prompt?.family || "") !== "exclude-top-result") return "";\n    const condition = (prompt.conditions || []).find(item => item?.field === "playerId" && item?.operator === "notEquals");\n    return String(condition?.value || "");\n  }''',
              'excluded player helper'
          )
          s = replace_once(
              s,
              '      for (const group of selectionGroups) {\n        const { required, available } = group;',
              '      const reservoirLeaderCap = anyOffset < 2 ? WEEKLY_LEADER_PREFERRED_PROMPT_CAP : WEEKLY_LEADER_FALLBACK_PROMPT_CAP;\n\n      for (const group of selectionGroups) {\n        const { required, available } = group;',
              'reservoir leader cap'
          )
          s = replace_once(
              s,
              '''            .filter(candidate => {\n              const sourceId = String(candidate.record.id || "");\n              return sourceId && !sourceIds.has(sourceId) && semantic.canAddWeekly(candidate.prompt, semanticCounts, DAYS_IN_BATCH);\n            })\n            .sort((left, right) => {\n              const leftLeader = promptTopAnswerKey(left.prompt);\n              const rightLeader = promptTopAnswerKey(right.prompt);\n              const leftLeaderLoad = leftLeader ? Number(leaderCounts.get(leftLeader) || 0) : WEEKLY_PROMPTS;\n              const rightLeaderLoad = rightLeader ? Number(leaderCounts.get(rightLeader) || 0) : WEEKLY_PROMPTS;\n              return leftLeaderLoad - rightLeaderLoad\n                || semantic.weeklyLoad(left.prompt, semanticCounts) - semantic.weeklyLoad(right.prompt, semanticCounts);\n            });''',
              '''            .filter(candidate => {\n              const sourceId = String(candidate.record.id || "");\n              const leaderKey = promptTopAnswerKey(candidate.prompt);\n              const leaderLoad = leaderKey ? Number(leaderCounts.get(leaderKey) || 0) : 0;\n              return sourceId\n                && !sourceIds.has(sourceId)\n                && semantic.canAddWeekly(candidate.prompt, semanticCounts, DAYS_IN_BATCH)\n                && (!leaderKey || leaderLoad < reservoirLeaderCap);\n            })\n            .sort((left, right) => {\n              const leftLeader = promptTopAnswerKey(left.prompt);\n              const rightLeader = promptTopAnswerKey(right.prompt);\n              const leftLeaderLoad = leftLeader ? Number(leaderCounts.get(leftLeader) || 0) : WEEKLY_PROMPTS;\n              const rightLeaderLoad = rightLeader ? Number(leaderCounts.get(rightLeader) || 0) : WEEKLY_PROMPTS;\n              const leftRelief = excludedTopPlayerId(left.prompt);\n              const rightRelief = excludedTopPlayerId(right.prompt);\n              const leftReliefLoad = leftRelief ? Number(leaderCounts.get(leftRelief) || 0) : 0;\n              const rightReliefLoad = rightRelief ? Number(leaderCounts.get(rightRelief) || 0) : 0;\n              return rightReliefLoad - leftReliefLoad\n                || leftLeaderLoad - rightLeaderLoad\n                || semantic.weeklyLoad(left.prompt, semanticCounts) - semantic.weeklyLoad(right.prompt, semanticCounts);\n            });''',
              'reservoir choice policy'
          )
          s = replace_once(
              s,
              '''      const semanticIssues = semantic?.dayIssues?.(dayPrompts) || [];\n      if (semanticIssues.length) return { ok: false, reason: `${day} contains overly similar prompts: ${semanticIssues[0].description}.` };\n      weekIds.push(...result.promptIds.map(String));''',
              '''      const semanticIssues = semantic?.dayIssues?.(dayPrompts) || [];\n      if (semanticIssues.length) return { ok: false, reason: `${day} contains overly similar prompts: ${semanticIssues[0].description}.` };\n      const dayLeaderDiversity = topAnswerDiversityAudit(dayPrompts);\n      if (dayLeaderDiversity.repeatSlots) {\n        const repeated = dayLeaderDiversity.repeatedPlayers[0];\n        return { ok: false, reason: `${day} repeats top-answer player ${repeated?.name || repeated?.playerId || "unknown"} across ${repeated?.count || 2} prompts. Same-day top answers must be unique.` };\n      }\n      weekIds.push(...result.promptIds.map(String));''',
              'final same-day certification'
          )
          s = s.replace('18-family proportional cycle · ${reservoir.plan.cycleFamilies.length ?', '18-family cycle · ${reservoir.plan.targets?.["exclude-top-result"] || 0} Exclude Top Result relief prompts · ${reservoir.plan.cycleFamilies.length ?', 1)
          s = s.replace('no same-day semantic clashes were allowed, and the 3-day leader-spacing audit', 'no same-day semantic clashes or repeated top-answer players were allowed, and the 3-day leader-spacing audit', 1)
          p.write_text(s)

          # Seven-day planner.
          p = Path('js/admin-batch-calendar.js')
          s = p.read_text()
          s = replace_once(s, 'Theme & Formation Engine v3.8.0:', 'Theme & Formation Engine v3.9.0:', 'batch header')
          s = replace_once(s, 'const ANSWER_DIVERSITY_POLICY_VERSION = 6;', 'const ANSWER_DIVERSITY_POLICY_VERSION = 7;', 'answer diversity version')
          s = replace_once(
              s,
              '    for (const count of hardKeyCounts.values()) minimum = Math.max(minimum, count);\n    return minimum;',
              '    for (const count of hardKeyCounts.values()) minimum = Math.max(minimum, count);\n    if (!group.synthetic) minimum = Math.max(minimum, group.prompts.length);\n    return minimum;',
              'leader minimum days uniqueness'
          )
          s = replace_once(
              s,
              '        const day = days[dayIndex];\n        if (day.positionCounts[position] >= Number(requiredFormation[position] || 0)) return false;',
              '        const day = days[dayIndex];\n        if (!group.synthetic && day.promptIds.some(id => group.promptById.has(id))) return false;\n        if (day.positionCounts[position] >= Number(requiredFormation[position] || 0)) return false;',
              'leader group one-per-day'
          )
          s = replace_once(
              s,
              '      const semanticIssues = semantic.dayIssues(prompts);\n      if (semanticIssues.length) return { ok: false, reason: semanticIssues[0].message };',
              '      const semanticIssues = semantic.dayIssues(prompts);\n      if (semanticIssues.length) return { ok: false, reason: semanticIssues[0].message };\n      if (sameDayLeaderRepeatCount(prompts)) return { ok: false, reason: "The leader-day pre-plan repeats a top-answer player on the same day." };',
              'preplanned same-day guard'
          )
          s = replace_once(
              s,
              '''      // Three separate leader days is the weekly hard ceiling. Repeated prompts on this same\n      // day are fine because the current day is only committed once after the XI passes.\n      if ([...weeklyLeaderIds(draft)].some(playerId => weeklyLeaderHistory(weeklyLeaderDays, playerId).length >= WEEKLY_LEADER_HARD_DAY_CAP)) continue;''',
              '''      // A Daily XI must not repeat the same #1 answer player. Cross-day repeats remain\n      // governed by the preferred two-day / hard three-day weekly policy.\n      if (sameDayLeaderRepeatCount(draft)) continue;\n      if ([...weeklyLeaderIds(draft)].some(playerId => weeklyLeaderHistory(weeklyLeaderDays, playerId).length >= WEEKLY_LEADER_HARD_DAY_CAP)) continue;''',
              'candidate same-day guard'
          )
          s = s.replace('the hard same-day semantic-diversity guard and the strict three-leader-day weekly cap.', 'same-day semantic/top-answer uniqueness and the strict three-leader-day weekly cap.', 1)
          s = replace_once(
              s,
              '''  function leaderRepeatedInDraft(prompt, currentDraft) {\n    const leaderId = core.getPromptStats(prompt)?.bestAnswer?.playerId;\n    if (!leaderId) return false;\n    return currentDraft.some(item => core.getPromptStats(item)?.bestAnswer?.playerId === leaderId);\n  }''',
              '''  function leaderRepeatedInDraft(prompt, currentDraft) {\n    const leaderId = core.getPromptStats(prompt)?.bestAnswer?.playerId;\n    if (!leaderId) return false;\n    return currentDraft.some(item => core.getPromptStats(item)?.bestAnswer?.playerId === leaderId);\n  }\n\n  function sameDayLeaderRepeatCount(draft) {\n    const counts = new Map();\n    let repeats = 0;\n    for (const prompt of draft || []) {\n      const leaderId = String(core.getPromptStats(prompt)?.bestAnswer?.playerId || "");\n      if (!leaderId) continue;\n      const next = Number(counts.get(leaderId) || 0) + 1;\n      counts.set(leaderId, next);\n      if (next > 1) repeats += 1;\n    }\n    return repeats;\n  }''',
              'same-day repeat helper'
          )
          s = replace_once(
              s,
              '''    if (semantic?.filterDayCompatible) {\n      options = semantic.filterDayCompatible(options, currentDraft);\n      if (!options.length) return null;\n    }\n    const usedFamilies = new Set(currentDraft.map(promptFamily));''',
              '''    if (semantic?.filterDayCompatible) {\n      options = semantic.filterDayCompatible(options, currentDraft);\n      if (!options.length) return null;\n    }\n    const freshLeaderOptions = options.filter(prompt => !leaderRepeatedInDraft(prompt, currentDraft));\n    if (freshLeaderOptions.length) options = freshLeaderOptions;\n    const usedFamilies = new Set(currentDraft.map(promptFamily));''',
              'fresh same-day leader options'
          )
          s = replace_once(
              s,
              '''      if (sameDayLeader) {\n        // Multiple prompts led by the same player on one Daily Challenge count as one leader day.\n        // A small grouping preference helps concentrate unavoidable repeats instead of spreading them.\n        weight *= 1.2;\n      } else if (leaderId) {''',
              '''      if (sameDayLeader) {\n        weight /= 1000;\n      } else if (leaderId) {''',
              'same-day leader weighting'
          )
          s = replace_once(
              s,
              '    for (const count of clubs.values()) if (count > 2) penalty += (count - 2) * 10;',
              '    for (const count of leaders.values()) if (count > 1) penalty += (count - 1) * 5000;\n    for (const count of clubs.values()) if (count > 2) penalty += (count - 2) * 10;',
              'same-day draft penalty'
          )
          s = replace_once(
              s,
              '        if (semantic.dayIssues(promptsForDay).length) return false;\n        return Object.keys(requiredFormation).every(position => days[dayIndex].positionCounts[position] === requiredFormation[position]);',
              '        if (semantic.dayIssues(promptsForDay).length) return false;\n        if (sameDayLeaderRepeatCount(promptsForDay)) return false;\n        return Object.keys(requiredFormation).every(position => days[dayIndex].positionCounts[position] === requiredFormation[position]);',
              'preplan final validation'
          )
          s = s.replace('same-day semantic diversity and the hard max-3 leader rule.', 'same-day semantic/top-answer uniqueness and the hard max-3 leader rule.', 1)
          s = s.replace('Same-day repeats are allowed. The certified 77-prompt reservoir', 'Same-day top-answer repeats are blocked. The certified 77-prompt reservoir', 1)
          p.write_text(s)

          # Answer-diversity verifier: move from v6 same-day grouping to v7 uniqueness.
          p = Path('scripts/verify-weekly-top-answer-diversity.mjs')
          s = p.read_text()
          s = s.replace('["policy v6", "const ANSWER_DIVERSITY_POLICY_VERSION = 6;"]', '["policy v7", "const ANSWER_DIVERSITY_POLICY_VERSION = 7;"]')
          s = s.replace('["same-day grouping", "sameDayLeader"],\n  ["same-day repeats allowed", "Multiple prompts led by the same player on one Daily Challenge count as one leader day."],', '["same-day repeat helper", "function sameDayLeaderRepeatCount(draft)"],\n  ["same-day fresh-leader preference", "const freshLeaderOptions = options.filter(prompt => !leaderRepeatedInDraft(prompt, currentDraft));"],\n  ["same-day hard candidate guard", "if (sameDayLeaderRepeatCount(draft)) continue;"],\n  ["same-day preplan separation", "day.promptIds.some(id => group.promptById.has(id))"],')
          s = s.replace('if (batch.includes("if (leaderRepeatedInDraft(prompt, currentDraft)) weight /= 8;")) throw new Error("Same-day leader repeats are still penalised.");', 'if (batch.includes("Same-day repeats are allowed.")) throw new Error("Same-day leader repeats are still allowed by the audit copy.");')
          s += '''\nfor (const token of [\n  'const EXCLUDE_TOP_RESULT_WEEKLY_MIN = 4;',\n  'function excludedTopPlayerId(prompt)',\n  'rightReliefLoad - leftReliefLoad',\n  'WEEKLY_LEADER_PREFERRED_PROMPT_CAP = 2',\n  'WEEKLY_LEADER_FALLBACK_PROMPT_CAP = 3',\n  'Same-day top answers must be unique.'\n]) {\n  if (!guard.includes(token)) throw new Error(`Missing reservoir uniqueness / exclusion-relief check: ${token}`);\n}\n'''
          p.write_text(s)

          # Other guard verifiers follow the new runtime version and policy tokens.
          for path in ['scripts/verify-all-season-certification-gate.mjs', 'scripts/verify-weekly-certified-snapshot-race.mjs']:
              p = Path(path)
              s = p.read_text().replace('saved-library generation guard v2.5.3', 'saved-library generation guard v2.6.0')
              p.write_text(s)
          p = Path('scripts/verify-weekly-certified-snapshot-race.mjs')
          s = p.read_text()
          anchor = "assert(guard.includes('topAnswerDiversity: frozenTopAnswerDiversity'), '77-prompt reservoir does not expose its top-answer diversity audit.');"
          if anchor not in s:
              raise SystemExit('weekly verifier diversity anchor not found')
          s = s.replace(anchor, anchor + "\nassert(guard.includes('EXCLUDE_TOP_RESULT_WEEKLY_MIN = 4'), 'Exclude Top Result does not have its diversity-relief floor.');\nassert(guard.includes('reservoirLeaderCap = anyOffset < 2'), 'Reservoir does not enforce preferred-two / fallback-three leader caps.');\nassert(guard.includes('rightReliefLoad - leftReliefLoad'), 'Exclude Top Result prompts are not prioritised against overloaded leaders.');\nassert(guard.includes('Same-day top answers must be unique.'), 'Final weekly certification does not reject same-day repeated leaders.');")
          p.write_text(s)

          # Cache/version wiring. Keep the architectural manifest identity on prompt-v2.
          p = Path('config/asset-manifest.json')
          s = p.read_text()
          s = replace_once(s, '"version": "4.0.1-adaptive-reservoir"', '"version": "4.0.2-leader-uniqueness"', 'asset manifest runtime version')
          s = replace_once(s, '"version": "3.8.0-preplan-fastpath"', '"version": "3.9.0-leader-uniqueness"', 'batch calendar asset version')
          s = replace_once(s, '"version": "2.5.3-adaptive-reservoir"', '"version": "2.6.0-leader-uniqueness"', 'guard asset version')
          p.write_text(s)

          p = Path('scripts/verify-prompt-studio-clean-reset.mjs')
          s = p.read_text().replace("manifest.assets?.assetManifestRuntime?.version === '4.0.1-adaptive-reservoir'", "manifest.assets?.assetManifestRuntime?.version === '4.0.2-leader-uniqueness'")
          p.write_text(s)
          PY

      - name: Rebuild generated wiring
        shell: bash
        run: |
          node scripts/build-asset-manifest-runtime.mjs
          node scripts/build-native-daily-workspace.mjs
          node scripts/build-studio-cache-tags.mjs

      - name: Verify
        shell: bash
        run: |
          node --check js/admin-daily-generator-guard.js
          node --check js/admin-batch-calendar.js
          node scripts/verify-weekly-top-answer-diversity.mjs
          node scripts/verify-weekly-certified-snapshot-race.mjs
          node scripts/verify-all-season-certification-gate.mjs
          node scripts/verify-daily-curated-authority-v1.mjs
          node scripts/verify-daily-semantic-diversity-v1.mjs
          node scripts/verify-prompt-studio-clean-reset.mjs
          git diff --check

      - name: Commit
        shell: bash
        run: |
          rm .github/workflows/apply-same-day-top-answer-uniqueness.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Enforce same-day top-answer uniqueness'
          git push
