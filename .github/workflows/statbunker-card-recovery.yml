name: StatBunker card recovery audit

on:
  push:
    branches:
      - data/statbunker-2012-14-card-save-recovery
  pull_request:
  workflow_dispatch:

jobs:
  recover:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Diagnose unresolved identities
        run: node scripts/diagnose-murphy-zaha-records.mjs
      - name: Probe StatBunker access routes
        run: node scripts/probe-statbunker-access.mjs
      - name: Probe StatBunker save endpoints
        run: node scripts/probe-statbunker-saves.mjs
      - name: Recover 2012/13 and 2013/14 cards from StatBunker
        run: node scripts/recover-statbunker-cards-2012-14.mjs
      - name: Upload recovery report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: statbunker-card-recovery-2012-14
          path: reports/statbunker-card-recovery-2012-14.json
          if-no-files-found: ignore
