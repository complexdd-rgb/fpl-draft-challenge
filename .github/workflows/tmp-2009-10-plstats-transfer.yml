name: Temporary 2009-10 PL Stats Transfer

on:
  push:
    paths:
      - '.github/workflows/tmp-2009-10-plstats-transfer.yml'

jobs:
  transfer:
    runs-on: ubuntu-latest
    steps:
      - name: Collect 2009-10 league and per-club player stats
        shell: python
        run: |
          import io, json, os, urllib.request, zipfile
          owner = 'imadeddine-belkat'
          repo = 'Premier-League-Stats'
          raw_base = f'https://raw.githubusercontent.com/{owner}/{repo}/main/'
          merged = 'pl_stats/_merged/players/2009-10_players_stats.csv'
          urllib.request.urlretrieve(raw_base + merged, '2009-10_players_stats.csv')
          tree_url = f'https://api.github.com/repos/{owner}/{repo}/git/trees/main?recursive=1'
          with urllib.request.urlopen(tree_url) as resp:
              tree = json.load(resp)['tree']
          paths = sorted(x['path'] for x in tree if x.get('type') == 'blob' and x['path'].startswith('pl_stats/') and x['path'].endswith('/players_stats/2009-10_players_stats.csv'))
          if not paths:
              raise SystemExit('No per-club 2009-10 player files found')
          with zipfile.ZipFile('2009-10_per_club_players_stats.zip', 'w', compression=zipfile.ZIP_DEFLATED) as z:
              for path in paths:
                  with urllib.request.urlopen(raw_base + path) as resp:
                      data = resp.read()
                  z.writestr(path, data)
          print('per-club files', len(paths))
          print('\n'.join(paths))
          print('merged bytes', os.path.getsize('2009-10_players_stats.csv'))
          print('per-club zip bytes', os.path.getsize('2009-10_per_club_players_stats.zip'))
      - name: Upload merged source
        uses: actions/upload-artifact@v4
        with:
          name: plstats-2009-10-source-v2
          path: 2009-10_players_stats.csv
          if-no-files-found: error
      - name: Upload per-club source bundle
        uses: actions/upload-artifact@v4
        with:
          name: plstats-2009-10-per-club
          path: 2009-10_per_club_players_stats.zip
          if-no-files-found: error
