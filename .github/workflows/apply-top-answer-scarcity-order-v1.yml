name: Apply top-answer scarcity order v1

on:
  push:
    branches:
      - daily-weekly-top-answer-uniqueness-v1
    paths:
      - 'scripts/apply-top-answer-scarcity-order-v1.py'
      - '.github/workflows/apply-top-answer-scarcity-order-v1.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply scarcity order
        run: python scripts/apply-top-answer-scarcity-order-v1.py
      - name: Verify
        run: |
          node --check js/admin-daily-generator-guard.js
          node scripts/verify-weekly-top-answer-diversity.mjs
          node scripts/verify-weekly-certified-snapshot-race.mjs
          node scripts/verify-daily-semantic-diversity-v1.mjs
          node scripts/verify-prompt-studio-clean-reset.mjs
          node scripts/verify-all-season-certification-gate.mjs
          git diff --check
      - name: Commit production changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add js/admin-daily-generator-guard.js scripts/verify-weekly-top-answer-diversity.mjs scripts/verify-weekly-certified-snapshot-race.mjs
          if git diff --cached --quiet; then
            echo 'No production changes to commit.'
          else
            git commit -m 'Prioritise scarce weekly top-answer alternatives'
            git push origin HEAD:daily-weekly-top-answer-uniqueness-v1
          fi