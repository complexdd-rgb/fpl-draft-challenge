name: Apply cleanup relevance pass 21

on:
  push:
    branches:
      - cleanup-relevance-pass21
    paths:
      - '.github/workflows/apply-cleanup-relevance-pass21.yml'
      - 'scripts/apply-cleanup-relevance-pass21.mjs'

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: cleanup-relevance-pass21
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Apply CSS cleanup
        run: node scripts/apply-cleanup-relevance-pass21.mjs

      - name: Verify production diff
        run: |
          ! grep -q 'Phase 4: Prompt Library Manager' admin-base.css
          ! grep -q 'manager-count-grid' admin-base.css
          ! grep -q 'manager-toolbar' admin-base.css
          ! grep -q 'manager-actions' admin-base.css
          ! grep -q 'library-prompt-chips' admin-base.css
          grep -q 'Phase 5: name-rule starters' admin-base.css
          ! grep -q 'manager-count-grid' admin-stage-one.css
          grep -q 'audit-summary-grid article' admin-stage-one.css
          grep -q 'admin-base.css?v=16.2.1' admin.css
          grep -q 'admin.css?v=16.2.1' admin.html
          grep -q 'admin-stage-one.css?v=1.0.1' admin.html
          git diff --check

      - name: Commit production cleanup
        run: |
          if git diff --quiet -- admin-base.css admin-stage-one.css admin.css admin.html; then
            echo 'No production cleanup changes to commit.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add admin-base.css admin-stage-one.css admin.css admin.html
          git commit -m 'Prune retired Prompt Manager base CSS'
          git push origin HEAD:cleanup-relevance-pass21
