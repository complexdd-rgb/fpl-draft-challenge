name: Apply Daily semantic diversity v1

on:
  push:
    branches:
      - prompt-studio-daily-similarity-guard-v1
    paths:
      - 'scripts/apply-daily-semantic-diversity-v1.mjs'
      - 'scripts/finish-daily-semantic-diversity-v1.mjs'
      - '.github/workflows/apply-daily-semantic-diversity-v1.yml'

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Apply semantic diversity patch
        shell: bash
        run: |
          set +e
          node scripts/apply-daily-semantic-diversity-v1.mjs
          patch_status=$?
          set -e
          if [ "$patch_status" -ne 0 ]; then
            echo "Primary patcher stopped at the known duplicated Studio-workflow anchor; validating and finishing the already-applied working-tree changes."
          fi
          node scripts/finish-daily-semantic-diversity-v1.mjs

      - name: Verify patched JavaScript
        run: |
          node --check js/daily-semantic-diversity-v1.js
          node --check js/admin-daily-generator-guard.js
          node --check js/admin-batch-calendar.js
          node --check scripts/verify-daily-semantic-diversity-v1.mjs
          node --check scripts/verify-weekly-certified-snapshot-race.mjs
          node scripts/verify-daily-semantic-diversity-v1.mjs
          node scripts/verify-weekly-certified-snapshot-race.mjs
          git diff --check

      - name: Commit runtime patch
        shell: bash
        run: |
          set -euo pipefail
          git add config/asset-manifest.json js/admin-daily-generator-guard.js js/admin-batch-calendar.js scripts/verify-prompt-studio-clean-reset.mjs scripts/verify-weekly-certified-snapshot-race.mjs .github/workflows/studio-wiring.yml
          if git diff --cached --quiet; then
            echo 'Semantic diversity runtime is already current.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Wire Daily semantic diversity guard'
          git push origin "HEAD:${GITHUB_REF_NAME}"
