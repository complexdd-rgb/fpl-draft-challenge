name: Inverse anti-meta prompt families

on:
  pull_request:
    paths:
      - 'scripts/apply-inverse-anti-meta.mjs'
      - '.github/workflows/inverse-anti-meta.yml'
      - 'js/prompt-quality-family-generator.js'
  push:
    branches: [main]
    paths:
      - 'scripts/apply-inverse-anti-meta.mjs'
      - '.github/workflows/inverse-anti-meta.yml'

permissions:
  contents: write

jobs:
  apply-and-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply inverse anti-meta family policy
        run: node scripts/apply-inverse-anti-meta.mjs
      - name: Verify creator syntax and inverse families
        run: |
          node --check js/prompt-quality-family-generator.js
          grep -q 'ANTI_META_INVERSE_POLICY_VERSION = 1' js/prompt-quality-family-generator.js
          grep -q 'inverse-points' js/prompt-quality-family-generator.js
          grep -q 'low-output-workhorse' js/prompt-quality-family-generator.js
          grep -q 'Number(p.points) <' js/prompt-quality-family-generator.js
          grep -q 'addInverseAntiMeta(position, positionCandidates)' js/prompt-quality-family-generator.js
      - name: Publish generated creator update on main
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          if git diff --quiet -- js/prompt-quality-family-generator.js; then
            echo 'Prompt creator already contains inverse anti-meta families.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add js/prompt-quality-family-generator.js
          git commit -m 'Add inverse anti-meta prompt families'
          git push
