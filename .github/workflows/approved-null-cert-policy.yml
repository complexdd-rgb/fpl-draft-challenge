name: Approved-null certification policy

on:
  pull_request:
    paths:
      - 'js/certification-approved-null-policy.js'
      - 'js/admin-batch-calendar.js'
      - 'js/admin-daily-generator-guard.js'
      - 'scripts/apply-approved-null-cert-policy.mjs'
      - 'scripts/apply-weekly-nationality-hard-reservation.mjs'
      - 'scripts/apply-weekly-certified-snapshot-race.mjs'
      - 'scripts/apply-weekly-rotation-library-evolution.mjs'
      - 'scripts/verify-weekly-nationality-hard-reservation.mjs'
      - 'scripts/verify-weekly-certified-snapshot-race.mjs'
      - 'scripts/verify-weekly-rotation-library-evolution.mjs'
      - 'scripts/diagnose-certified-nationality-pool.mjs'
      - 'scripts/diagnose-weekly-day-one.mjs'
      - '.github/workflows/approved-null-cert-policy.yml'
  push:
    branches: [main]
    paths:
      - 'js/certification-approved-null-policy.js'
      - 'js/admin-batch-calendar.js'
      - 'js/admin-daily-generator-guard.js'
      - 'scripts/apply-approved-null-cert-policy.mjs'
      - 'scripts/apply-weekly-nationality-hard-reservation.mjs'
      - 'scripts/apply-weekly-certified-snapshot-race.mjs'
      - 'scripts/apply-weekly-rotation-library-evolution.mjs'
      - 'scripts/verify-weekly-nationality-hard-reservation.mjs'
      - 'scripts/verify-weekly-certified-snapshot-race.mjs'
      - 'scripts/verify-weekly-rotation-library-evolution.mjs'
      - 'scripts/diagnose-certified-nationality-pool.mjs'
      - 'scripts/diagnose-weekly-day-one.mjs'
      - '.github/workflows/approved-null-cert-policy.yml'

permissions:
  contents: write

jobs:
  wire-and-check:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Wire policy into Studio
        run: |
          node scripts/apply-approved-null-cert-policy.mjs
          node --check js/certification-approved-null-policy.js
          node --check js/validation-engine.js
          node --check js/admin-batch-calendar.js
          node --check js/admin-daily-generator-guard.js
          grep -q 'js/certification-approved-null-policy.js?v=1.0.0' admin.html
          grep -q 'js/admin-batch-calendar.js?v=3.0.6' admin.html
          grep -q 'js/admin-daily-generator-guard.js?v=1.1.2' admin.html
          git diff --check
      - name: Diagnose certified nationality pool
        run: node scripts/diagnose-certified-nationality-pool.mjs
      - name: Reproduce weekly day-one generation
        run: node scripts/diagnose-weekly-day-one.mjs
      - name: Publish generated Studio wiring
        if: github.event_name == 'push'
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "$(git status --porcelain -- admin.html js/admin-batch-calendar.js js/admin-daily-generator-guard.js)" ]]; then
            echo "Studio wiring, weekly generator and Daily Challenge guard are already current."
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- admin.html js/admin-batch-calendar.js js/admin-daily-generator-guard.js
          git commit -m 'Wire Studio generation policies'
          git push