name: Approved-null certification policy

on:
  pull_request:
    paths:
      - 'js/certification-approved-null-policy.js'
      - 'js/validation-engine.js'
      - 'js/admin-daily-library-cutover-v1.js'
      - 'js/admin-daily-generator-guard.js'
      - 'js/admin-batch-calendar.js'
      - 'fragments/admin-daily-workspace.html'
      - 'admin.html'
      - 'scripts/verify-daily-library-cutover-v1.mjs'
      - 'scripts/verify-weekly-certified-snapshot-race.mjs'
      - 'scripts/verify-native-daily-workspace.mjs'
      - '.github/workflows/approved-null-cert-policy.yml'
  push:
    branches: [main]
    paths:
      - 'js/certification-approved-null-policy.js'
      - 'js/validation-engine.js'
      - 'js/admin-daily-library-cutover-v1.js'
      - 'js/admin-daily-generator-guard.js'
      - 'js/admin-batch-calendar.js'
      - 'fragments/admin-daily-workspace.html'
      - 'admin.html'
      - 'scripts/verify-daily-library-cutover-v1.mjs'
      - 'scripts/verify-weekly-certified-snapshot-race.mjs'
      - 'scripts/verify-native-daily-workspace.mjs'
      - '.github/workflows/approved-null-cert-policy.yml'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Check certification runtime syntax
        run: |
          node --check js/certification-approved-null-policy.js
          node --check js/validation-engine.js
          node --check js/admin-daily-library-cutover-v1.js
          node --check js/admin-daily-generator-guard.js
          node --check js/admin-batch-calendar.js

      - name: Verify saved-library Daily certification boundary
        run: node scripts/verify-daily-library-cutover-v1.mjs

      - name: Verify seven-day reservoir certification
        run: node scripts/verify-weekly-certified-snapshot-race.mjs

      - name: Verify native Daily workspace
        run: node scripts/verify-native-daily-workspace.mjs

      - name: Reject whitespace errors
        run: git diff --check
