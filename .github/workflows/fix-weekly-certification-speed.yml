name: Apply weekly certification speed fix

on:
  push:
    branches:
      - fix/18-family-weekly-certification-speed-2

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply patch
        run: python scripts/apply-weekly-certification-speed-fix.py
      - name: Rebuild generated wiring
        run: |
          node scripts/build-asset-manifest-runtime.mjs
          node scripts/build-studio-cache-tags.mjs
      - name: Verify
        run: |
          node --check js/admin-daily-generator-guard.js
          node scripts/verify-weekly-certified-snapshot-race.mjs
          node scripts/verify-all-season-certification-gate.mjs
      - name: Commit
        run: |
          rm .github/workflows/fix-weekly-certification-speed.yml scripts/apply-weekly-certification-speed-fix.py
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "Speed up 18-family weekly certification"
          git push
