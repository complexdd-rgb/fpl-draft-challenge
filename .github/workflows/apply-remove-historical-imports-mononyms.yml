name: Apply Historical Imports retirement

on:
  push:
    branches:
      - remove-historical-imports-mononyms
    paths:
      - 'scripts/apply-remove-historical-imports-mononyms.mjs'
      - '.github/workflows/apply-remove-historical-imports-mononyms.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: remove-historical-imports-mononyms
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply migration
        run: node scripts/apply-remove-historical-imports-mononyms.mjs
      - name: Normalize generated migration output
        run: |
          node - <<'NODE'
          const fs = require('node:fs');
          const verifier = 'scripts/verify-admin-ui-truth.mjs';
          let source = fs.readFileSync(verifier, 'utf8');
          source = source.replace('const sandbox = { window: {} };', 'const sandbox = { window: { addEventListener: () => {} } };');
          fs.writeFileSync(verifier, source.replace(/\s*$/, '\n'));
          for (const path of ['js/admin-core.js']) {
            const text = fs.readFileSync(path, 'utf8');
            fs.writeFileSync(path, text.replace(/\s*$/, '\n'));
          }
          NODE
      - name: Rebuild generated Studio wiring/cache tags
        run: |
          node scripts/build-asset-manifest-runtime.mjs
          node scripts/build-studio-cache-tags.mjs
          node scripts/build-native-daily-workspace.mjs
      - name: Verify changed architecture
        run: |
          node scripts/verify-admin-ui-truth.mjs
          node scripts/verify-prompt-studio-clean-reset.mjs
          node scripts/verify-studio-refresh-fastboot.mjs
          node scripts/verify-native-daily-workspace.mjs
          node --check js/admin-core.js
          node --check js/admin-stage-one.js
          node --check js/prompt-studio-clean-reset.js
          git diff --check
      - name: Commit migration output
        shell: bash
        run: |
          set -euo pipefail
          # The installation token cannot push modifications to permanent workflow files.
          # Restore that one file here; it is updated separately through the GitHub connector.
          git restore --source=HEAD -- .github/workflows/studio-regression.yml
          if git diff --quiet; then
            echo 'No migration changes to commit.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Retire Historical Imports UI and verify mononyms'
          git push origin HEAD:remove-historical-imports-mononyms
