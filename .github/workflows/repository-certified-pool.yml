name: Repository certified prompt pool

on:
  pull_request:
    paths:
      - 'prompt-library.js'
      - 'js/repository-certified-prompt-pool.js'
      - 'js/admin-daily-library-cutover-v1.js'
      - 'js/admin-daily-generator-guard.js'
      - 'js/admin-batch-calendar.js'
      - 'scripts/verify-repository-certified-prompt-pool.mjs'
      - 'scripts/verify-daily-library-cutover-v1.mjs'
      - 'scripts/verify-weekly-certified-snapshot-race.mjs'
      - '.github/workflows/repository-certified-pool.yml'
  push:
    branches: [main]
    paths:
      - 'prompt-library.js'
      - 'js/repository-certified-prompt-pool.js'
      - 'js/admin-daily-library-cutover-v1.js'
      - 'js/admin-daily-generator-guard.js'
      - 'js/admin-batch-calendar.js'
      - 'scripts/verify-repository-certified-prompt-pool.mjs'
      - 'scripts/verify-daily-library-cutover-v1.mjs'
      - 'scripts/verify-weekly-certified-snapshot-race.mjs'
      - '.github/workflows/repository-certified-pool.yml'

permissions:
  contents: read

concurrency:
  group: repository-certified-pool-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Verify clean zero repository boundary
        run: node scripts/verify-repository-certified-prompt-pool.mjs

      - name: Verify saved-library Daily cutover boundary
        run: node scripts/verify-daily-library-cutover-v1.mjs

      - name: Verify immutable 77-prompt weekly reservoir
        run: node scripts/verify-weekly-certified-snapshot-race.mjs

      - name: Check current runtime syntax
        run: |
          node --check js/repository-certified-prompt-pool.js
          node --check js/admin-daily-library-cutover-v1.js
          node --check js/admin-daily-generator-guard.js
          node --check js/admin-batch-calendar.js
          node --check scripts/verify-repository-certified-prompt-pool.mjs
          node --check scripts/verify-daily-library-cutover-v1.mjs
          node --check scripts/verify-weekly-certified-snapshot-race.mjs
          git diff --check
