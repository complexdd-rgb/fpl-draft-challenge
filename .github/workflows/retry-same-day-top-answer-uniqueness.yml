name: Retry same-day top-answer uniqueness

on:
  push:
    branches:
      - 'feature/same-day-top-answer-uniqueness'
    paths:
      - '.github/workflows/retry-same-day-top-answer-uniqueness.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Reapply policy patch and refresh stale verifier wording
        shell: bash
        run: |
          python - <<'PATCHPY'
          from pathlib import Path

          workflow = Path('.github/workflows/apply-same-day-top-answer-uniqueness.yml').read_text()
          marker = "          python - <<'PY'\n"
          start = workflow.index(marker) + len(marker)
          end = workflow.index("\n          PY\n", start)
          block = workflow[start:end]
          script = "\n".join(line[10:] if line.startswith("          ") else line for line in block.splitlines())
          exec(compile(script, 'replayed-top-answer-patch.py', 'exec'))

          verifier = Path('scripts/verify-weekly-certified-snapshot-race.mjs')
          text = verifier.read_text()
          old = "'same-day semantic-diversity guard'"
          new = "'same-day semantic/top-answer uniqueness'"
          if old not in text:
              raise SystemExit('stale immutable-guard wording anchor not found')
          verifier.write_text(text.replace(old, new, 1))
          PATCHPY

      - name: Rebuild generated wiring
        shell: bash
        run: |
          node scripts/build-asset-manifest-runtime.mjs
          node scripts/build-native-daily-workspace.mjs
          node scripts/build-studio-cache-tags.mjs

      - name: Verify
        shell: bash
        run: |
          node --check js/admin-daily-generator-guard.js
          node --check js/admin-batch-calendar.js
          node scripts/verify-weekly-top-answer-diversity.mjs
          node scripts/verify-weekly-certified-snapshot-race.mjs
          node scripts/verify-all-season-certification-gate.mjs
          node scripts/verify-daily-curated-authority-v1.mjs
          node scripts/verify-daily-semantic-diversity-v1.mjs
          node scripts/verify-prompt-studio-clean-reset.mjs
          git diff --check

      - name: Commit
        shell: bash
        run: |
          rm .github/workflows/apply-same-day-top-answer-uniqueness.yml
          rm .github/workflows/retry-same-day-top-answer-uniqueness.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Use exclusion prompts to enforce top-answer uniqueness'
          git push
