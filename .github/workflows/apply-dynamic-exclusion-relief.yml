name: Apply dynamic exclusion relief

on:
  push:
    branches:
      - 'fix/dynamic-exclusion-relief'
    paths:
      - '.github/workflows/apply-dynamic-exclusion-relief.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply dynamic Exclude Top Result relief
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import json

          def replace_once(text, old, new, label):
              if old not in text:
                  raise SystemExit(f'{label} anchor not found')
              return text.replace(old, new, 1)

          p = Path('js/admin-daily-generator-guard.js')
          s = p.read_text()
          s = replace_once(s, 'saved-library generation guard v2.6.1.', 'saved-library generation guard v2.6.2.', 'guard header')
          s = replace_once(s, 'const VERSION = "2.6.1";', 'const VERSION = "2.6.2";', 'guard version')
          s = replace_once(
              s,
              '  const EXCLUDE_TOP_RESULT_WEEKLY_MIN = 4;\n  const WEEKLY_LEADER_PREFERRED_PROMPT_CAP = 2;',
              '  const EXCLUDE_TOP_RESULT_WEEKLY_MIN = 4;\n  const EXCLUDE_TOP_RESULT_WEEKLY_MAX = 8;\n  const WEEKLY_LEADER_PREFERRED_PROMPT_CAP = 2;',
              'exclude max constant'
          )
          s = replace_once(
              s,
              '  function allocateFamilyTargets(familyIndex) {',
              '  function allocateFamilyTargets(familyIndex, excludeTarget = EXCLUDE_TOP_RESULT_WEEKLY_MIN) {',
              'family target signature'
          )
          s = replace_once(
              s,
              '    if (Object.hasOwn(targets, "exclude-top-result") && targets["exclude-top-result"] < EXCLUDE_TOP_RESULT_WEEKLY_MIN) {\n      let needed = EXCLUDE_TOP_RESULT_WEEKLY_MIN - targets["exclude-top-result"];',
              '    if (Object.hasOwn(targets, "exclude-top-result") && targets["exclude-top-result"] < excludeTarget) {\n      let needed = excludeTarget - targets["exclude-top-result"];',
              'dynamic exclude target'
          )

          old = '''    const targets = allocateFamilyTargets(cutover.familyIndex);\n    if (!targets || Object.values(targets).reduce((sum, value) => sum + Number(value || 0), 0) !== WEEKLY_PROMPTS) {\n      throw new Error("The 18-family proportional weekly target could not be allocated to 77 prompt slots.");\n    }\n    const families = Object.keys(targets).filter(family => targets[family] > 0);\n    const positionNeeds = weeklyPositionNeeds();\n    const usedIds = knownUsedSourceIds();\n    const recentIds = knownRecentSourceIds(7);\n    const limits = answerLimits();\n    const runtimeCache = new Map();\n    const cycleFamilies = new Set();\n    const shardByFamily = new Map(payload.shards.map(shard => [String(shard.family), shard]));\n    let bestReservoir = null;\n\n    for (let anyOffset = 0; anyOffset < POSITION_ORDER.length; anyOffset += 1) {'''
          new = '''    const targetPlans = [];\n    for (let excludeTarget = EXCLUDE_TOP_RESULT_WEEKLY_MIN; excludeTarget <= EXCLUDE_TOP_RESULT_WEEKLY_MAX; excludeTarget += 1) {\n      const targets = allocateFamilyTargets(cutover.familyIndex, excludeTarget);\n      if (!targets || Object.values(targets).reduce((sum, value) => sum + Number(value || 0), 0) !== WEEKLY_PROMPTS) continue;\n      targetPlans.push({ excludeTarget, targets });\n    }\n    if (!targetPlans.length) {\n      throw new Error("The 18-family weekly target could not be allocated to 77 prompt slots, even with Exclude Top Result relief.");\n    }\n    const positionNeeds = weeklyPositionNeeds();\n    const usedIds = knownUsedSourceIds();\n    const recentIds = knownRecentSourceIds(7);\n    const limits = answerLimits();\n    const runtimeCache = new Map();\n    const cycleFamilies = new Set();\n    const shardByFamily = new Map(payload.shards.map(shard => [String(shard.family), shard]));\n\n    for (const targetPlan of targetPlans) {\n      const targets = targetPlan.targets;\n      const families = Object.keys(targets).filter(family => targets[family] > 0);\n      let bestReservoir = null;\n\n      for (let anyOffset = 0; anyOffset < POSITION_ORDER.length; anyOffset += 1) {'''
          s = replace_once(s, old, new, 'dynamic relief outer loop')

          s = replace_once(
              s,
              '      setStatus(`Selecting the 77-prompt reservoir from ${scanned.toLocaleString("en-GB")} checked candidates · diversity layout ${anyOffset + 1}/${POSITION_ORDER.length}…`, "working");',
              '      setStatus(`Selecting the 77-prompt reservoir from ${scanned.toLocaleString("en-GB")} checked candidates · ${Number(targets["exclude-top-result"] || 0)} Exclude Top Result prompts · diversity layout ${anyOffset + 1}/${POSITION_ORDER.length}…`, "working");',
              'relief progress status'
          )

          s = replace_once(
              s,
              '        targets: Object.freeze({ ...targets }),\n        positionNeeds: Object.freeze({ ...positionNeeds }),',
              '        targets: Object.freeze({ ...targets }),\n        excludeTopResultTarget: Number(targets["exclude-top-result"] || 0),\n        positionNeeds: Object.freeze({ ...positionNeeds }),',
              'relief plan metadata'
          )

          old = '''      if (frozenTopAnswerDiversity.repeatSlots === 0) return reservoir;\n    }\n\n    if (bestReservoir) return bestReservoir;\n    throw new Error("The saved 18-family library could not build a 77-prompt reservoir while preserving formation, family, semantic and max-three leader constraints. Exclude Top Result relief was applied, but no valid layout was found.");'''
          new = '''      if (frozenTopAnswerDiversity.repeatSlots === 0) return reservoir;\n      }\n\n      // Use the smallest Exclude Top Result relief level that can produce a valid reservoir.\n      // This preserves the normal family mix when possible, while allowing extra exclusion\n      // prompts to displace over-concentrated superstar-led slots only when needed.\n      if (bestReservoir) return bestReservoir;\n    }\n\n    throw new Error(`The saved 18-family library could not build a 77-prompt reservoir while preserving formation, semantic and max-three leader constraints, even after increasing Exclude Top Result relief from ${EXCLUDE_TOP_RESULT_WEEKLY_MIN} to ${EXCLUDE_TOP_RESULT_WEEKLY_MAX} prompts.`);'''
          s = replace_once(s, old, new, 'dynamic relief completion')
          p.write_text(s)

          for path in ['scripts/verify-weekly-certified-snapshot-race.mjs', 'scripts/verify-all-season-certification-gate.mjs']:
              q = Path(path)
              t = q.read_text().replace('saved-library generation guard v2.6.1', 'saved-library generation guard v2.6.2')
              q.write_text(t)

          q = Path('scripts/verify-weekly-certified-snapshot-race.mjs')
          t = q.read_text()
          t = replace_once(t, "'function allocateFamilyTargets(familyIndex)',", "'function allocateFamilyTargets(familyIndex, excludeTarget = EXCLUDE_TOP_RESULT_WEEKLY_MIN)',", 'verifier function signature')
          t = replace_once(
              t,
              "assert(guard.includes('EXCLUDE_TOP_RESULT_WEEKLY_MIN = 4'), 'Exclude Top Result does not have its diversity-relief floor.');",
              "assert(guard.includes('EXCLUDE_TOP_RESULT_WEEKLY_MIN = 4'), 'Exclude Top Result does not have its diversity-relief floor.');\nassert(guard.includes('EXCLUDE_TOP_RESULT_WEEKLY_MAX = 8'), 'Exclude Top Result does not have its bounded dynamic-relief ceiling.');\nassert(guard.includes('for (let excludeTarget = EXCLUDE_TOP_RESULT_WEEKLY_MIN; excludeTarget <= EXCLUDE_TOP_RESULT_WEEKLY_MAX; excludeTarget += 1)'), 'Reservoir does not escalate Exclude Top Result relief when the base family mix is leader-concentrated.');\nassert(guard.includes('if (bestReservoir) return bestReservoir;'), 'Reservoir does not stop at the smallest successful Exclude Top Result relief level.');",
              'verifier dynamic relief assertions'
          )
          q.write_text(t)

          manifest_path = Path('config/asset-manifest.json')
          manifest = json.loads(manifest_path.read_text())
          manifest['assets']['assetManifestRuntime']['version'] = '4.0.4-dynamic-exclusion-relief'
          manifest['assets']['adminDailyGeneratorGuard']['version'] = '2.6.2-dynamic-exclusion-relief'
          manifest_path.write_text(json.dumps(manifest, indent=2) + '\n')
          PY

      - name: Rebuild generated Studio wiring
        run: |
          node scripts/build-asset-manifest-runtime.mjs
          node scripts/build-native-daily-workspace.mjs
          node scripts/build-studio-cache-tags.mjs

      - name: Verify dynamic relief
        run: |
          node --check js/admin-daily-generator-guard.js
          node scripts/verify-weekly-certified-snapshot-race.mjs
          node scripts/verify-weekly-top-answer-diversity.mjs
          node scripts/verify-daily-semantic-diversity-v1.mjs
          node scripts/verify-daily-curated-authority-v1.mjs
          node scripts/verify-all-season-certification-gate.mjs
          node scripts/verify-prompt-studio-clean-reset.mjs

      - name: Commit patch
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/apply-dynamic-exclusion-relief.yml
          git add -A
          if git diff --cached --quiet; then
            echo 'No changes to commit.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Escalate Exclude Top Result relief dynamically'
          git push origin "HEAD:${GITHUB_REF_NAME}"

# second push triggers this workflow after creation
