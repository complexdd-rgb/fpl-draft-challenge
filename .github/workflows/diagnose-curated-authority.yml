name: Diagnose curated authority

on:
  push:
    branches:
      - 'prompt-studio-*'
    paths:
      - '.github/workflows/diagnose-curated-authority.yml'
      - 'scripts/verify-daily-curated-authority-v1.mjs'
      - 'js/admin-daily-curated-authority-v1.js'
      - 'prompt-library-curated-v1/**'
      - 'prompt-library-curated-v2/**'

permissions:
  contents: write

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Capture verifier and selector hashes
        shell: bash
        run: |
          set +e
          node scripts/verify-daily-curated-authority-v1.mjs > /tmp/authority-diagnostic.txt 2>&1
          status=$?
          set -e
          printf '\nexit_status=%s\n\nselector_hashes:\n' "$status" >> /tmp/authority-diagnostic.txt
          node --input-type=module <<'NODE' >> /tmp/authority-diagnostic.txt
          import fs from 'node:fs';
          import crypto from 'node:crypto';
          const manifest = JSON.parse(fs.readFileSync('prompt-library-curated-v2/manifest.json', 'utf8'));
          for (const descriptor of manifest.familySelectors || []) {
            const raw = fs.readFileSync(descriptor.path, 'utf8');
            const nodeHash = crypto.createHash('sha256').update(raw).digest('hex');
            const digest = await crypto.webcrypto.subtle.digest('SHA-256', new TextEncoder().encode(raw));
            const webHash = [...new Uint8Array(digest)].map(value => value.toString(16).padStart(2, '0')).join('');
            console.log(JSON.stringify({
              family: descriptor.family,
              expected: descriptor.sha256,
              expectedLength: String(descriptor.sha256).length,
              nodeHash,
              webHash,
              nodeEquals: nodeHash === descriptor.sha256,
              webEquals: webHash === descriptor.sha256,
              expectedCodes: [...String(descriptor.sha256)].map(char => char.charCodeAt(0))
            }));
          }
          NODE
          cat /tmp/authority-diagnostic.txt
          cp /tmp/authority-diagnostic.txt reports/authority-ci-diagnostic.txt
      - name: Commit diagnostic
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add reports/authority-ci-diagnostic.txt
          if ! git diff --cached --quiet; then
            git commit -m 'Record WebCrypto authority diagnostic'
            git push
          fi
