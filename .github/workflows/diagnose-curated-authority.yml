name: Finalize 18-family generator wiring

on:
  push:
    branches:
      - 'prompt-studio-finalize-18-family-prompts'
    paths:
      - '.github/workflows/diagnose-curated-authority.yml'

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply final 18-family copy, tagging and fixture updates
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import json

          guard_path = Path('js/admin-daily-generator-guard.js')
          guard = guard_path.read_text()
          replacements = {
              'matches the real 17-family': 'matches the real 18-family',
              '17-family pool checking…': '18-family pool checking…',
              'Validating the saved promoted 17-family library before generation…': 'Validating the saved promoted 18-family library before generation…',
              'The 17-family proportional weekly target could not be allocated to 77 prompt slots.': 'The 18-family proportional weekly target could not be allocated to 77 prompt slots.',
              '"club-count", "manager", "anti-meta", "value", "minutes-role", "composite-story"': '"club-count", "manager", "anti-meta", "exclude-top-result", "value", "minutes-role", "composite-story"'
          }
          for old, new in replacements.items():
              if old not in guard:
                  raise SystemExit(f'Missing expected guard token: {old}')
              guard = guard.replace(old, new)
          guard_path.write_text(guard)

          verifier_path = Path('scripts/verify-weekly-certified-snapshot-race.mjs')
          verifier = verifier_path.read_text()
          old = "['manager', 140], ['anti-meta', 200], ['value', 170], ['minutes-role', 210], ['composite-story', 190]"
          new = "['manager', 140], ['anti-meta', 200], ['exclude-top-result', 62], ['value', 170], ['minutes-role', 210], ['composite-story', 190]"
          if old not in verifier:
              raise SystemExit('Missing weekly family-weight fixture token')
          verifier = verifier.replace(old, new)
          verifier_path.write_text(verifier)

          config_path = Path('config/asset-manifest.json')
          config = json.loads(config_path.read_text())
          config['assets']['adminDailyGeneratorGuard']['version'] = '2.5.1-18-family'
          config_path.write_text(json.dumps(config, indent=2) + '\n')

          Path('reports/authority-ci-diagnostic.txt').unlink(missing_ok=True)
          Path('.github/workflows/diagnose-curated-authority.yml').unlink(missing_ok=True)
          PY

          node scripts/build-asset-manifest-runtime.mjs
          node --check js/admin-daily-generator-guard.js
          node scripts/verify-weekly-certified-snapshot-race.mjs

      - name: Commit final wiring and remove diagnostics
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Finalize 18-family generator wiring'
          git push
