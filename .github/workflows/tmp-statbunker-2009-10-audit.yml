name: Temporary StatBunker 2009-10 Audit Transfer

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/tmp-statbunker-2009-10-audit.yml'
  workflow_dispatch:

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - name: Fetch StatBunker 2009-10 pages
        run: |
          mkdir -p statbunker_2009_10
          curl -L --fail --retry 3 --user-agent 'Mozilla/5.0' 'https://www.statbunker.com/competitions/PlayerStandings?comp_id=279' -o statbunker_2009_10/player_standings.html
          curl -L --fail --retry 3 --user-agent 'Mozilla/5.0' 'https://www.statbunker.com/competitions/SeasonAppearances?comp_id=279' -o statbunker_2009_10/season_appearances.html
          curl -L --fail --retry 3 --user-agent 'Mozilla/5.0' 'https://www.statbunker.com/competitions/FantasyFootballPlayersStats?comp_id=279' -o statbunker_2009_10/fantasy_stats.html
          wc -c statbunker_2009_10/*
      - name: Upload pages
        uses: actions/upload-artifact@v4
        with:
          name: statbunker-2009-10-audit
          path: statbunker_2009_10/
