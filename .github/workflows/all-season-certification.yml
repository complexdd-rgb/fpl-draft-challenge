name: All-season certification

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  certify-all-seasons:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Verify deferred all-season boundary
        run: node scripts/verify-all-season-certification-gate.mjs

      - name: Verify saved-library Daily cutover boundary
        run: node scripts/verify-daily-library-cutover-v1.mjs

      - name: Verify immutable weekly generation reservoir
        run: node scripts/verify-weekly-certified-snapshot-race.mjs

      - name: Check boundary syntax
        run: |
          node --check scripts/verify-all-season-certification-gate.mjs
          node --check scripts/verify-daily-library-cutover-v1.mjs
          node --check scripts/verify-weekly-certified-snapshot-race.mjs
          git diff --check
