name: All-season certification

on:
  pull_request:
  workflow_dispatch:

jobs:
  certify-all-seasons:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Verify browser certified-library gate
        run: node scripts/verify-all-season-certification-gate.mjs

      - name: Certify every season against the approved 4-star library
        run: node scripts/diagnose-approved-library-certification.mjs
