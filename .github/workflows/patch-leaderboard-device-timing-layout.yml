name: Patch leaderboard device timing layout

on:
  push:
    branches:
      - fix/leaderboard-device-timing-layout-20260909
    paths:
      - scripts/patch-leaderboard-device-timing-layout.mjs
      - .github/workflows/patch-leaderboard-device-timing-layout.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/leaderboard-device-timing-layout-20260909
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Apply patch
        run: node scripts/patch-leaderboard-device-timing-layout.mjs

      - name: Verify targeted invariants
        run: |
          node --check js/leaderboard-client.js
          node scripts/test-leaderboard-device-timing-layout.mjs

      - name: Commit patched files
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add js/leaderboard-client.js index.html .github/workflows/live-challenge-cleanup-v1.yml
          if git diff --cached --quiet; then
            echo 'Patch already applied.'
            exit 0
          fi
          git commit -m 'Fix leaderboard device timing and page placement'
          git push origin HEAD:fix/leaderboard-device-timing-layout-20260909
