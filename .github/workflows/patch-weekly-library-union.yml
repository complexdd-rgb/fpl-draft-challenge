name: Patch weekly prompt library union
on:
  push:
    branches: [fix-nationality-generator-union]
    paths:
      - 'scripts/patch-weekly-library-union.mjs'
      - '.github/workflows/patch-weekly-library-union.yml'
jobs:
  apply:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix-nationality-generator-union
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply weekly library union
        run: node scripts/patch-weekly-library-union.mjs
      - name: Syntax check
        run: node --check js/admin-batch-calendar.js
      - name: Commit patched generator
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add js/admin-batch-calendar.js
          git commit -m 'Use combined prompt library in weekly generator'
          git push
