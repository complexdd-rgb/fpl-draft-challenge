name: Temporary StatBunker 2009-10 Full Harvest

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/tmp-statbunker-2009-10-full-harvest.yml'
  workflow_dispatch:

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - name: Fetch remaining club standings
        shell: bash
        run: |
          set -e
          mkdir -p remaining
          curl -L --fail --retry 3 --connect-timeout 20 --max-time 120 \
            'https://r.jina.ai/http://www.statbunker.com/competitions/PlayerStandings?comp_id=279&club_id=3' \
            -o remaining/Manchester_United_3_player_standings.txt
          curl -L --fail --retry 3 --connect-timeout 20 --max-time 120 \
            'https://r.jina.ai/http://www.statbunker.com/competitions/PlayerStandings?comp_id=279&club_id=187' \
            -o remaining/Stoke_City_187_player_standings.txt
          wc -c remaining/*
      - name: Upload pages
        uses: actions/upload-artifact@v4
        with:
          name: statbunker-2009-10-remaining-clubs
          path: remaining/
