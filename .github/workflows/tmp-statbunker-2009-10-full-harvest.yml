name: Temporary StatBunker 2009-10 Full Harvest

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/tmp-statbunker-2009-10-full-harvest.yml'
  workflow_dispatch:

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - name: Fetch StatBunker 2009-10 bulk pages via text proxy
        shell: bash
        run: |
          set -e
          mkdir -p statbunker_2009_10
          curl -L --fail --retry 3 'https://r.jina.ai/http://m.statbunker.com/competitions/PlayerStandings?comp_id=279' -o statbunker_2009_10/player_standings.txt
          curl -L --fail --retry 3 'https://r.jina.ai/http://m.statbunker.com/competitions/SeasonAppearances?comp_id=279' -o statbunker_2009_10/season_appearances.txt
          curl -L --fail --retry 3 'https://r.jina.ai/http://po.statbunker.com/competitions/TopYellowCards?comp_id=279' -o statbunker_2009_10/yellow_cards.txt
          wc -c statbunker_2009_10/*
      - name: Upload pages
        uses: actions/upload-artifact@v4
        with:
          name: statbunker-2009-10-full-harvest
          path: statbunker_2009_10/
