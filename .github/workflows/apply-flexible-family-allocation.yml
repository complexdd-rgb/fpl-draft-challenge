name: Apply flexible family allocation

on:
  push:
    branches:
      - 'fix/flexible-family-allocation'
    paths:
      - '.github/workflows/apply-flexible-family-allocation.yml'
      - '_tools/apply-flexible-family-allocation.py'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Apply flexible family allocation
        run: python _tools/apply-flexible-family-allocation.py

      - name: Rebuild generated Studio wiring
        run: |
          node scripts/build-asset-manifest-runtime.mjs
          node scripts/build-native-daily-workspace.mjs
          node scripts/build-studio-cache-tags.mjs

      - name: Verify flexible family allocation
        run: |
          node --check js/admin-daily-generator-guard.js
          node scripts/verify-weekly-certified-snapshot-race.mjs
          node scripts/verify-weekly-top-answer-diversity.mjs
          node scripts/verify-daily-semantic-diversity-v1.mjs
          node scripts/verify-daily-curated-authority-v1.mjs
          node scripts/verify-all-season-certification-gate.mjs
          node scripts/verify-prompt-studio-clean-reset.mjs

      - name: Commit patch and remove one-shot files
        shell: bash
        run: |
          rm .github/workflows/apply-flexible-family-allocation.yml
          rm _tools/apply-flexible-family-allocation.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Replace proportional family quotas with flexible bounds'
          git push origin HEAD:fix/flexible-family-allocation
