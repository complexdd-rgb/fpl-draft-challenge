name: Apply cleanup relevance pass 20

on:
  push:
    branches:
      - cleanup-relevance-pass20
    paths:
      - '.github/workflows/apply-cleanup-relevance-pass20.yml'
      - 'scripts/apply-cleanup-relevance-pass20.mjs'

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: cleanup-relevance-pass20
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Apply CSS cleanup
        run: node scripts/apply-cleanup-relevance-pass20.mjs

      - name: Verify production diff
        run: |
          ! grep -q 'promptManagerSearch' admin-prompts-mobile-v1.css
          ! grep -q 'manager-count-grid' admin-prompts-mobile-v1.css
          ! grep -q 'resetPromptManagerBtn' admin-prompts-mobile-v1.css
          grep -q 'career-shape-rule-panel' admin-prompts-mobile-v1.css
          grep -q 'prompt-factory-settings' admin-prompts-mobile-v1.css
          ! grep -q 'career-shape-factory' admin-prompts-mobile-v1-1.css
          ! grep -q 'careerShapeFactoryStatus' admin-prompts-mobile-v1-1.css
          grep -q 'prompt-factory-options' admin-prompts-mobile-v1-1.css
          grep -q 'prompt-quality-head .phase-chip' admin-prompts-mobile-v1-1.css
          grep -q 'admin-prompts-mobile-v1.css?v=1.0.1' admin.css
          grep -q 'admin-prompts-mobile-v1-1.css?v=1.1.1' admin.css
          git diff --check

      - name: Commit production cleanup
        run: |
          if git diff --quiet -- admin.css admin-prompts-mobile-v1.css admin-prompts-mobile-v1-1.css; then
            echo 'No production cleanup changes to commit.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add admin.css admin-prompts-mobile-v1.css admin-prompts-mobile-v1-1.css
          git commit -m 'Prune retired Prompt Studio mobile selectors'
          git push origin HEAD:cleanup-relevance-pass20
