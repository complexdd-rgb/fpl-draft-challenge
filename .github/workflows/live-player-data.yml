name: Live player data

on:
  push:
    branches: [main]
    paths:
      - 'players.js'
      - 'scripts/build-live-players.mjs'
      - 'scripts/apply-2011-12-import.mjs'
      - 'data/fpl-2011-12-import-v15.part-*'
      - 'data/fpl-2011-12-import-v15.parts'
      - '.github/workflows/live-player-data.yml'
  pull_request:
    paths:
      - 'players.js'
      - 'scripts/build-live-players.mjs'
      - 'scripts/apply-2011-12-import.mjs'
      - 'data/fpl-2011-12-import-v15.part-*'
      - 'data/fpl-2011-12-import-v15.parts'
      - 'players-live.js'
      - '.github/workflows/live-player-data.yml'

permissions:
  contents: write

jobs:
  build-live-player-data:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Apply certified 2011/12 import
        run: |
          node scripts/apply-2011-12-import.mjs players.js data/fpl-2011-12-import-v15.parts
          node --check players.js

      - name: Build slim player-facing database
        run: |
          node scripts/build-live-players.mjs
          node --check players-live.js

      - name: Verify or publish generated database
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            echo "Certified migration and live database build completed successfully."
            git diff --stat -- players.js players-live.js
            exit 0
          fi
          if [[ -z "$(git status --porcelain -- players.js players-live.js)" ]]; then
            echo "players.js and players-live.js are already current."
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- players.js players-live.js
          git commit -m 'Import certified 2011/12 player database'
          git push
