name: Apply top-answer cache

on:
  push:
    branches:
      - 'fix/cache-top-answer-selection'
    paths:
      - '.github/workflows/apply-top-answer-cache.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply top-answer cache patch
        run: python scripts/_apply_top_answer_cache.py
      - name: Rebuild generated Studio wiring
        run: |
          node scripts/build-asset-manifest-runtime.mjs
          node scripts/build-native-daily-workspace.mjs
          node scripts/build-studio-cache-tags.mjs
      - name: Verify cached top-answer selection
        run: |
          node --check js/admin-daily-generator-guard.js
          node scripts/verify-weekly-certified-snapshot-race.mjs
          node scripts/verify-weekly-top-answer-diversity.mjs
          node scripts/verify-daily-semantic-diversity-v1.mjs
          node scripts/verify-daily-curated-authority-v1.mjs
          node scripts/verify-all-season-certification-gate.mjs
          node scripts/verify-prompt-studio-clean-reset.mjs
      - name: Commit patch and remove one-shot files
        run: |
          rm .github/workflows/apply-top-answer-cache.yml scripts/_apply_top_answer_cache.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Cache top-answer stats during weekly selection'
          git push origin HEAD:fix/cache-top-answer-selection
