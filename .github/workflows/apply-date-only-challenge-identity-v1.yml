name: Apply date-only Daily identity v1

on:
  push:
    branches:
      - prompt-studio-date-only-challenge-identity-v1
    paths:
      - 'scripts/apply-date-only-challenge-identity-v1.mjs'
      - 'scripts/fix-date-only-patcher-v1.mjs'
      - '.github/workflows/apply-date-only-challenge-identity-v1.yml'

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Repair and apply date-only identity patch
        run: |
          node scripts/fix-date-only-patcher-v1.mjs
          node --check scripts/apply-date-only-challenge-identity-v1.mjs
          node scripts/apply-date-only-challenge-identity-v1.mjs

      - name: Rebuild generated Studio wiring
        run: |
          node scripts/build-native-daily-workspace.mjs
          node scripts/build-asset-manifest-runtime.mjs
          node scripts/build-studio-cache-tags.mjs

      - name: Verify date-only Daily boundary
        run: |
          node --check js/admin-batch-calendar.js
          node --check js/admin-daily-generator-guard.js
          node --check js/admin-daily-publish.js
          node --check scripts/verify-weekly-certified-snapshot-race.mjs
          node --check scripts/verify-prompt-studio-clean-reset.mjs
          node scripts/verify-daily-semantic-diversity-v1.mjs
          node scripts/verify-weekly-certified-snapshot-race.mjs
          node scripts/verify-native-daily-workspace.mjs
          node scripts/verify-prompt-studio-clean-reset.mjs
          git diff --check

      - name: Commit runtime migration
        shell: bash
        run: |
          set -euo pipefail
          git add -A
          if git diff --cached --quiet; then
            echo 'Date-only Daily identity runtime is already current.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Use release date as Daily Challenge identity'
          git push origin "HEAD:${GITHUB_REF_NAME}"
