name: Temporary PL Stats Transfer

on:
  push:
    paths:
      - '.github/workflows/plstats-transfer-temp.yml'

jobs:
  fetch-source:
    runs-on: ubuntu-latest
    steps:
      - name: Download 2010-11 Premier-League-Stats source
        run: |
          curl -L --fail --retry 3 \
            'https://raw.githubusercontent.com/imadeddine-belkat/Premier-League-Stats/main/pl_stats/_merged/players/2010-11_players_stats.csv' \
            -o 2010-11_players_stats.csv
          sha256sum 2010-11_players_stats.csv
          wc -l 2010-11_players_stats.csv
      - name: Upload source artifact
        uses: actions/upload-artifact@v4
        with:
          name: plstats-2010-11-source
          path: 2010-11_players_stats.csv
          if-no-files-found: error
