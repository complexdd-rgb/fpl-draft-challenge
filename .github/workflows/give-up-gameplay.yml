name: Give Up gameplay

on:
  pull_request:
    paths:
      - 'js/give-up-gameplay.js'
      - 'js/daily-challenge-loader.js'
      - '.github/workflows/give-up-gameplay.yml'
  push:
    branches: [main]
    paths:
      - 'js/give-up-gameplay.js'
      - 'js/daily-challenge-loader.js'
      - '.github/workflows/give-up-gameplay.yml'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Syntax check Give Up gameplay files
        run: |
          node --check js/give-up-gameplay.js
          node --check js/daily-challenge-loader.js
      - name: Verify Give Up wiring and safety rules
        run: |
          grep -q 'give-up-gameplay.js' js/daily-challenge-loader.js
          grep -q 'Give up · 0 points' js/give-up-gameplay.js
          grep -q 'skippedPrompts' js/give-up-gameplay.js
          ! grep -q 'removeLegacySelectionPanel' js/give-up-gameplay.js
          ! grep -q 'class="challenge-overview"' index.html
          grep -q 'completed !== total' js/give-up-gameplay.js
