name: Apply live performance pass 2

on:
  push:
    branches: [main]
    paths:
      - 'scripts/apply-live-performance-pass-2.mjs'
      - '.github/workflows/apply-live-performance-pass-2.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Apply guarded changes
        run: |
          node scripts/apply-live-performance-pass-2.mjs
          node --check js/leaderboard-config.js
          node --check js/leaderboard-client.js
          node --check js/leaderboard-team-view.js
          node --check js/player-profile.js
          node --check js/leaderboard-all-time.js

      - name: Commit live performance pass
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add js/leaderboard-config.js js/leaderboard-client.js js/leaderboard-team-view.js js/player-profile.js js/leaderboard-all-time.js
          if git diff --cached --quiet; then
            echo 'No changes to commit.'
            exit 0
          fi
          git commit -m 'Defer secondary live leaderboard work'
          git push
