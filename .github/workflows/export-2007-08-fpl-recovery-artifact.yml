name: Export 2007-08 FPL recovery artifact

on:
  push:
    branches:
      - research/2007-08-statbunker-enrichment
    paths:
      - .github/workflows/export-2007-08-fpl-recovery-artifact.yml
  workflow_dispatch:

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/2007-08-statbunker-enrichment
      - uses: actions/upload-artifact@v4
        with:
          name: fpl-2007-08-recovery-material
          path: research/2007-08-fpl-recovery/
          if-no-files-found: error
          retention-days: 7
