name: Retry dynamic exclusion relief

on:
  push:
    branches:
      - 'fix/dynamic-exclusion-relief'
    paths:
      - '.github/workflows/retry-dynamic-exclusion-relief.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Reapply dynamic relief patch and refresh verifier cache tag
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import textwrap

          workflow = Path('.github/workflows/apply-dynamic-exclusion-relief.yml').read_text()
          marker = "          python - <<'PY'\n"
          start = workflow.index(marker) + len(marker)
          end = workflow.index("\n          PY", start)
          code = textwrap.dedent(workflow[start:end])
          exec(compile(code, 'embedded-dynamic-relief.py', 'exec'))

          verifier = Path('scripts/verify-prompt-studio-clean-reset.mjs')
          text = verifier.read_text()
          old = "manifest.assets?.assetManifestRuntime?.version === '4.0.3-exclusion-relief'"
          new = "manifest.assets?.assetManifestRuntime?.version === '4.0.4-dynamic-exclusion-relief'"
          if old not in text:
              raise SystemExit('prompt studio cache-tag verifier anchor not found')
          verifier.write_text(text.replace(old, new, 1))
          PY

      - name: Rebuild generated Studio wiring
        run: |
          node scripts/build-asset-manifest-runtime.mjs
          node scripts/build-native-daily-workspace.mjs
          node scripts/build-studio-cache-tags.mjs

      - name: Verify dynamic relief
        run: |
          node --check js/admin-daily-generator-guard.js
          node scripts/verify-weekly-certified-snapshot-race.mjs
          node scripts/verify-weekly-top-answer-diversity.mjs
          node scripts/verify-daily-semantic-diversity-v1.mjs
          node scripts/verify-daily-curated-authority-v1.mjs
          node scripts/verify-all-season-certification-gate.mjs
          node scripts/verify-prompt-studio-clean-reset.mjs

      - name: Commit patch
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/apply-dynamic-exclusion-relief.yml .github/workflows/retry-dynamic-exclusion-relief.yml
          git add -A
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Escalate Exclude Top Result relief dynamically'
          git push origin "HEAD:${GITHUB_REF_NAME}"
