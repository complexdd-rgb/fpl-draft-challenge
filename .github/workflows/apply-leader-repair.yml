name: Apply leader repair

on:
  push:
    branches:
      - 'fix/constraint-aware-leader-selection'
    paths:
      - '.github/workflows/apply-leader-repair.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply constraint-aware leader repair
        shell: bash
        run: |
          echo '' | base64 -d > /tmp/leader-repair.py
          python /tmp/leader-repair.py

      - name: Rebuild generated Studio wiring
        run: |
          node scripts/build-asset-manifest-runtime.mjs
          node scripts/build-native-daily-workspace.mjs
          node scripts/build-studio-cache-tags.mjs

      - name: Verify leader repair
        run: |
          node --check js/admin-daily-generator-guard.js
          node scripts/verify-weekly-certified-snapshot-race.mjs
          node scripts/verify-weekly-top-answer-diversity.mjs
          node scripts/verify-daily-semantic-diversity-v1.mjs
          node scripts/verify-daily-curated-authority-v1.mjs
          node scripts/verify-all-season-certification-gate.mjs
          node scripts/verify-prompt-studio-clean-reset.mjs

      - name: Commit patch
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add js/admin-daily-generator-guard.js scripts/verify-weekly-certified-snapshot-race.mjs scripts/verify-all-season-certification-gate.mjs scripts/verify-prompt-studio-clean-reset.mjs config/asset-manifest.json js/asset-manifest.js admin.html
          git commit -m 'Repair weekly leader overload within fixed groups'
          git push origin HEAD:fix/constraint-aware-leader-selection
