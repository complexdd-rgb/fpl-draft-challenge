name: Apply cleanup relevance pass 23

on:
  push:
    branches:
      - cleanup-relevance-pass23
    paths:
      - '.github/workflows/apply-cleanup-relevance-pass23.yml'
      - 'scripts/apply-cleanup-relevance-pass23.mjs'

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: cleanup-relevance-pass23
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Apply CSS cleanup
        run: node scripts/apply-cleanup-relevance-pass23.mjs

      - name: Verify production diff
        run: |
          ! grep -q 'Phase 12 — official 2015/16 archive import' admin-base.css
          ! grep -q 'legacy-import-centre' admin-base.css
          ! grep -q 'legacy-source-grid' admin-base.css
          ! grep -q 'legacy-source-note' admin-base.css
          ! grep -q 'legacy-review-panel' admin-base.css
          ! grep -q 'legacy-regression-panel' admin-base.css
          ! grep -q 'legacy-source-link' admin-base.css
          grep -q 'Phase 13 — automatic prompt factory' admin-base.css
          grep -q 'prompt-factory' admin-base.css
          grep -q 'admin-base.css?v=16.2.3' admin.css
          git diff --check

      - name: Commit production cleanup
        run: |
          if git diff --quiet -- admin-base.css admin.css; then
            echo 'No production cleanup changes to commit.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add admin-base.css admin.css
          git commit -m 'Prune retired 2015/16 importer CSS'
          git push origin HEAD:cleanup-relevance-pass23
