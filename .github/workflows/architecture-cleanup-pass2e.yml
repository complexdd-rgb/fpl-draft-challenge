name: Architecture cleanup pass 2E

on:
  push:
    branches:
      - main
    paths:
      - scripts/architecture-cleanup-pass2e.mjs
      - .github/workflows/architecture-cleanup-pass2e.yml

permissions:
  contents: write

jobs:
  extract-live-styles:
    runs-on: ubuntu-latest
    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Extract live-page stylesheet
        run: node scripts/architecture-cleanup-pass2e.mjs

      - name: Verify extraction boundary
        shell: bash
        run: |
          set -euo pipefail
          test -s player-game.css
          grep -q '<link rel="stylesheet" href="player-game.css"/>' index.html
          ! grep -q '<style>' index.html
          ! grep -q '</style>' index.html
          grep -q 'Verify modular live-page stylesheet' .github/workflows/studio-regression.yml
          git diff --check

      - name: Remove one-shot migration tooling
        run: |
          rm scripts/architecture-cleanup-pass2e.mjs
          rm .github/workflows/architecture-cleanup-pass2e.yml

      - name: Commit Architecture Cleanup Pass 2E
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then
            echo 'No architecture cleanup changes to commit.'
            exit 0
          fi
          git commit -m 'Architecture Cleanup Pass 2E'
          git push origin HEAD:main
