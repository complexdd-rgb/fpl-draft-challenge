name: Temporary 2010-11 Morph certification

on:
  pull_request:
    branches: [main]

permissions:
  contents: write
  pull-requests: read

jobs:
  certify:
    if: github.head_ref == 'tmp/2010-11-unresolved-frontier-20260823'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Fetch frozen recovery inputs
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/fpl2010-frontier
          mkdir -p /tmp/fpl2010-frontier/official /tmp/fpl2010-frontier/vaastav

          git -C /tmp/fpl2010-frontier/official init -q
          git -C /tmp/fpl2010-frontier/official remote add origin https://github.com/elie222/Fantasy-Football-AI.git
          git -C /tmp/fpl2010-frontier/official sparse-checkout init --cone
          git -C /tmp/fpl2010-frontier/official sparse-checkout set 20_5_2013
          git -C /tmp/fpl2010-frontier/official fetch -q --depth 1 --filter=blob:none origin a607e4eb7a3002432cc39b20e0650af33dc334da
          git -C /tmp/fpl2010-frontier/official checkout -q FETCH_HEAD

          git -C /tmp/fpl2010-frontier/vaastav init -q
          git -C /tmp/fpl2010-frontier/vaastav remote add origin https://github.com/vaastav/Fantasy-Premier-League.git
          git -C /tmp/fpl2010-frontier/vaastav sparse-checkout init --cone
          git -C /tmp/fpl2010-frontier/vaastav sparse-checkout set data/2016-17/players data/2017-18/players
          git -C /tmp/fpl2010-frontier/vaastav fetch -q --depth 1 --filter=blob:none origin c2add969e11ec19002a091f8aa60164c9a255854
          git -C /tmp/fpl2010-frontier/vaastav checkout -q FETCH_HEAD

          python - <<'PY'
          import csv, urllib.request
          from pathlib import Path
          candidates = [
              '30cceaff2264a2d6a6757a080e94f41293818b90',
              '9810ee3436c7627741026ba600bda019c0fa3f29',
              'ae21b05d3d8e17c8c2f7c378e8a1eb3f0be6fd25',
          ]
          root=Path('/tmp/fpl2010-frontier')
          selected=None
          counts={}
          for sha in candidates:
              url=f'https://raw.githubusercontent.com/imadeddine-belkat/Premier-League-Stats/{sha}/pl_stats/_merged/players/2010-11_players_stats.csv'
              p=root/f'canonical-{sha[:8]}.csv'
              urllib.request.urlretrieve(url,p)
              with p.open(encoding='utf-8-sig',newline='') as f:
                  rows=list(csv.DictReader(f))
              count=sum(1 for r in rows if float(r.get('timePlayed') or 0)>0)
              counts[sha]=count
              print(f'{sha} positive-minute count={count}')
              if selected is None and count==544:
                  selected=(sha,p)
          if selected is None:
              raise RuntimeError(f'No pinned canonical candidate reproduced 544: {counts}')
          sha,p=selected
          (root/'canonical.csv').write_bytes(p.read_bytes())
          (root/'canonical-source.txt').write_text(sha+'\n',encoding='utf-8')
          print(f'Selected frozen canonical source: {sha}')
          PY

          curl -fsSL https://raw.githubusercontent.com/BrenPatF/item_category_optimization_oracle/af18698aad5a5084aa9e11709900e1571b04b03b/fantasy_premier_league_player_stats.csv -o /tmp/fpl2010-frontier/morph.csv
          curl -fsSL https://raw.githubusercontent.com/footballcsv/england/master/2010s/2010-11/eng.1.csv -o /tmp/fpl2010-frontier/fixtures.csv

      - name: Rebuild original unresolved frontier
        run: |
          rm -rf tmp/2010-11-frontier-output
          python tmp/reconcile_2010_11_frontier.py
          cp /tmp/fpl2010-frontier/canonical-source.txt tmp/2010-11-frontier-output/canonical-source.txt

      - name: Certify Morph archive
        run: |
          rm -rf tmp/morph-2010-11-certification
          python tmp/certify_morph_2010_11.py
          cp /tmp/fpl2010-frontier/canonical-source.txt tmp/morph-2010-11-certification/canonical-source.txt

      - name: Commit result files to temporary branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add tmp/2010-11-frontier-output tmp/morph-2010-11-certification
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'tmp: store 2010-11 Morph certification results'
          git push origin HEAD:${{ github.head_ref }}
