name: Apply live Career Shape gate

on:
  push:
    branches: [main]
    paths:
      - 'scripts/apply-live-career-shape-gate.mjs'
      - '.github/workflows/apply-live-career-shape-gate.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Apply and verify Career Shape startup gate
        run: |
          node scripts/apply-live-career-shape-gate.mjs
          node --check js/career-context.js
          git diff --check

      - name: Commit Career Shape gate
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add js/career-context.js
          git commit -m 'Skip unused Career Shape work on live page'
          git push
