name: Apply bounded reservoir search

on:
  push:
    branches:
      - 'fix/bounded-reservoir-backtracking'
    paths:
      - 'scripts/apply-bounded-reservoir-search-hotfix.py'
      - '.github/workflows/apply-bounded-reservoir-search.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply bounded backtracking fallback
        run: python scripts/apply-bounded-reservoir-search-hotfix.py
      - name: Rebuild generated Studio wiring
        run: |
          node scripts/build-asset-manifest-runtime.mjs
          node scripts/build-native-daily-workspace.mjs
          node scripts/build-studio-cache-tags.mjs
      - name: Verify bounded reservoir search
        run: |
          node --check js/admin-daily-generator-guard.js
          node scripts/verify-weekly-certified-snapshot-race.mjs
          node scripts/verify-weekly-top-answer-diversity.mjs
          node scripts/verify-daily-semantic-diversity-v1.mjs
          node scripts/verify-daily-curated-authority-v1.mjs
          node scripts/verify-all-season-certification-gate.mjs
          node scripts/verify-prompt-studio-clean-reset.mjs
      - name: Commit patch and remove one-shot files
        shell: bash
        run: |
          rm scripts/apply-bounded-reservoir-search-hotfix.py
          rm .github/workflows/apply-bounded-reservoir-search.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Add bounded leader-aware reservoir search'
          git push origin HEAD:fix/bounded-reservoir-backtracking
