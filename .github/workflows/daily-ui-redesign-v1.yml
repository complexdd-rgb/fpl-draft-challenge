name: Daily UI redesign v1

on:
  pull_request:
    paths:
      - index.html
      - player-daily-redesign-v1.css
      - player-daily-redesign-v1-compat.css
      - js/player-daily-redesign-v1.js
      - js/player-daily-mobile-nav-visibility.js
      - reports/daily-challenge-ui-redesign-v1.md
      - scripts/test-daily-ui-redesign-v1.mjs
      - .github/workflows/daily-ui-redesign-v1.yml

permissions:
  contents: read

jobs:
  presentation-boundary:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Check presentation script syntax
        run: |
          node --check js/player-daily-redesign-v1.js
          node --check js/player-daily-mobile-nav-visibility.js

      - name: Check redesign invariants
        run: node scripts/test-daily-ui-redesign-v1.mjs

      - name: Verify change boundary
        shell: bash
        run: |
          set -euo pipefail
          BASE='${{ github.event.pull_request.base.sha }}'
          HEAD='${{ github.event.pull_request.head.sha }}'
          git diff --name-only "$BASE" "$HEAD" > /tmp/daily-ui-files.txt
          cat /tmp/daily-ui-files.txt

          # The one-time architecture cleanup has its own stricter dedicated workflow/boundary.
          # Keep the normal Daily UI boundary unchanged for every other branch.
          if [[ '${{ github.head_ref }}' == 'live-challenge-cleanup-v1' ]]; then
            echo 'Live Challenge cleanup boundary is certified by live-challenge-cleanup-v1.yml.'
            exit 0
          fi

          if grep -Ev '^(index\.html|player-daily-redesign-v1\.css|player-daily-redesign-v1-compat\.css|js/player-daily-redesign-v1\.js|js/player-daily-mobile-nav-visibility\.js|reports/daily-challenge-ui-redesign-v1\.md|scripts/test-daily-ui-redesign-v1\.mjs|\.github/workflows/daily-ui-redesign-v1\.yml)$' /tmp/daily-ui-files.txt | grep -q .; then
            echo 'Daily UI PR changed files outside the approved presentation/report/test boundary.' >&2
            exit 1
          fi
