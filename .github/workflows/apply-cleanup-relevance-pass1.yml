name: Apply cleanup relevance pass 1

on:
  push:
    branches:
      - cleanup-relevance-pass1
    paths:
      - 'scripts/apply-cleanup-relevance-pass1.py'
      - '.github/workflows/apply-cleanup-relevance-pass1.yml'

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply pass 1 cleanup
        run: python scripts/apply-cleanup-relevance-pass1.py
      - name: Verify retained architecture
        run: |
          node scripts/verify-prompt-studio-clean-reset.mjs
          node scripts/verify-weekly-top-answer-diversity.mjs
          node scripts/verify-weekly-certified-snapshot-race.mjs
          node scripts/verify-daily-semantic-diversity-v1.mjs
          node scripts/verify-all-season-certification-gate.mjs
          node --check js/career-overlap-wording.js
          node --check js/admin-schedule-manager-v2.js
          node --check js/admin-batch-calendar.js
          node --check js/admin-daily-generator-guard.js
          git diff --check
      - name: Commit cleanup
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then
            echo 'No cleanup changes to commit.'
          else
            git commit -m 'Remove superseded Daily migration scaffolding'
            git push origin HEAD:cleanup-relevance-pass1
          fi
