name: Historical safe prompt checks

on:
  pull_request:
    paths:
      - 'js/prompt-historical-safe-pack-v1.js'
      - 'js/prompt-historical-era-pack-v1.js'
      - 'js/prompt-field-readiness.js'
      - 'js/prompt-field-readiness-panel.js'
      - 'js/historical-season-field-manifest.js'
      - 'js/career-overlap-wording.js'
      - 'scripts/check-historical-safe-prompt-pack.mjs'
      - '.github/workflows/historical-safe-prompts.yml'
  push:
    branches: [main]
    paths:
      - 'js/prompt-historical-safe-pack-v1.js'
      - 'js/prompt-historical-era-pack-v1.js'
      - 'js/prompt-field-readiness.js'
      - 'js/prompt-field-readiness-panel.js'
      - 'js/historical-season-field-manifest.js'
      - 'js/career-overlap-wording.js'
      - 'scripts/check-historical-safe-prompt-pack.mjs'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: JavaScript syntax checks
        run: |
          node --check js/prompt-historical-safe-pack-v1.js
          node --check js/prompt-historical-era-pack-v1.js
          node --check js/prompt-field-readiness.js
          node --check js/prompt-field-readiness-panel.js
          node --check js/historical-season-field-manifest.js
          node --check js/career-overlap-wording.js
          node --check scripts/check-historical-safe-prompt-pack.mjs
      - name: Historical prompt safety assertions
        run: node scripts/check-historical-safe-prompt-pack.mjs
