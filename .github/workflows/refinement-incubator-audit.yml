# The old Refinement Incubator runtime was retired by the clean Prompt Studio reset.
# Offline refinement source files may remain for audits/survivor research, but they are not runtime assets.
name: Refinement Incubator Audit

on:
  pull_request:
    paths:
      - 'config/asset-manifest.json'
      - 'js/studio-bootstrap.js'
      - 'js/prompt-refinement-incubator.js'
      - 'js/prompt-refinement-survivors-v1.js'
      - 'js/prompt-four-star-enforcer.js'
      - 'js/prompt-library-canonical-state.js'
      - 'js/prompt-library-legacy-additions-20260814.js'
      - 'scripts/apply-canonical-prompt-state.mjs'
      - 'scripts/verify-canonical-prompt-state.mjs'
      - 'scripts/verify-prompt-studio-redesign-policy.mjs'
      - 'scripts/verify-prompt-studio-clean-reset.mjs'
      - 'scripts/verify-all-season-certification-gate.mjs'
      - 'scripts/verify-weekly-certified-snapshot-race.mjs'
      - '.github/workflows/refinement-incubator-audit.yml'
  push:
    branches: [main]
    paths:
      - 'config/asset-manifest.json'
      - 'js/studio-bootstrap.js'
      - 'js/prompt-refinement-incubator.js'
      - 'js/prompt-refinement-survivors-v1.js'
      - 'js/prompt-four-star-enforcer.js'
      - 'js/prompt-library-canonical-state.js'
      - 'js/prompt-library-legacy-additions-20260814.js'
      - 'scripts/apply-canonical-prompt-state.mjs'
      - 'scripts/verify-canonical-prompt-state.mjs'
      - 'scripts/verify-prompt-studio-redesign-policy.mjs'
      - 'scripts/verify-prompt-studio-clean-reset.mjs'
      - 'scripts/verify-all-season-certification-gate.mjs'
      - 'scripts/verify-weekly-certified-snapshot-race.mjs'
      - '.github/workflows/refinement-incubator-audit.yml'

permissions:
  contents: read

concurrency:
  group: refinement-incubator-audit-${{ github.ref }}
  cancel-in-progress: true

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Verify clean Prompt Studio retirement boundary
        run: node scripts/verify-prompt-studio-clean-reset.mjs

      - name: Verify deferred all-season boundary
        run: node scripts/verify-all-season-certification-gate.mjs

      - name: Verify current Daily saved-library reservoir
        run: node scripts/verify-weekly-certified-snapshot-race.mjs

      - name: Confirm retired refinement assets are not runtime-owned
        shell: bash
        run: |
          set -euo pipefail
          ! grep -q 'ensureRefinementIncubator' js/studio-bootstrap.js
          ! grep -q '"promptRefinementIncubator"' config/asset-manifest.json
          ! grep -q '"promptRefinementSurvivors"' config/asset-manifest.json
          ! grep -q '"promptFourStarEnforcer"' config/asset-manifest.json
          ! grep -q '"promptLibraryCanonicalState"' config/asset-manifest.json
          ! grep -q '"promptLibraryLegacyAdditions"' config/asset-manifest.json
          test ! -e js/prompt-library-canonical-state.js
          test ! -e scripts/apply-canonical-prompt-state.mjs
          test ! -e scripts/verify-canonical-prompt-state.mjs
          test ! -e scripts/verify-prompt-studio-redesign-policy.mjs

      - name: Reject whitespace errors
        run: git diff --check
