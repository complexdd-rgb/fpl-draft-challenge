name: Patch 1996-97 status docs

on:
  push:
    branches:
      - harvest-1996-97-six-clubs
    paths:
      - scripts/patch-1996-97-status-docs.mjs
      - .github/workflows/patch-1996-97-status-docs.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: harvest-1996-97-six-clubs
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node scripts/patch-1996-97-status-docs.mjs
      - name: Commit corrected authority
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add PROJECT_ROADMAP.md reports/historical-season-status-audit-2026-09-08.md
          git commit -m 'Correct 1996-97 status to workbook authority'
          git push origin HEAD:harvest-1996-97-six-clubs
