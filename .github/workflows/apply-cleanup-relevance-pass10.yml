name: Apply cleanup relevance pass 10

on:
  push:
    branches:
      - cleanup-relevance-pass10
    paths:
      - 'scripts/apply-cleanup-relevance-pass10.py'
      - '.github/workflows/apply-cleanup-relevance-pass10.yml'

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Remove retired static Prompt Studio shell
        run: python scripts/apply-cleanup-relevance-pass10.py

      - name: Verify surviving Studio boundaries
        run: |
          node scripts/verify-prompt-studio-clean-reset.mjs
          node scripts/verify-native-daily-workspace.mjs
          node --check js/prompt-studio-clean-reset.js
          ! grep -q 'STUDIO_NATIVE_PROMPT_WORKSPACE_START' admin.html
          ! grep -q 'id="libraryManagerPanel"' admin.html
          git diff --check

      - name: Commit pass 10 production cleanup
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add admin.html scripts/verify-native-daily-workspace.mjs scripts/verify-prompt-studio-clean-reset.mjs ARCHITECTURE.md
          if git diff --cached --quiet; then
            echo 'No pass 10 production changes to commit.'
            exit 0
          fi
          git commit -m 'Remove retired static Prompt Studio shell'
          git push origin HEAD:cleanup-relevance-pass10
