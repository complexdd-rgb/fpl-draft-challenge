name: Apply cleanup relevance pass 4

on:
  push:
    branches:
      - cleanup-relevance-pass4
    paths:
      - 'scripts/apply-cleanup-relevance-pass4.py'
      - '.github/workflows/apply-cleanup-relevance-pass4.yml'

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Apply pass 4 cleanup
        run: python scripts/apply-cleanup-relevance-pass4.py

      - name: Rebuild canonical Studio wiring
        run: |
          node scripts/build-asset-manifest-runtime.mjs
          node scripts/build-native-daily-workspace.mjs
          node scripts/build-studio-cache-tags.mjs

      - name: Verify surviving architecture
        run: |
          node scripts/verify-prompt-studio-clean-reset.mjs
          node scripts/verify-native-daily-workspace.mjs
          node scripts/verify-prompt-factory-v1.mjs
          node scripts/verify-prompt-quality-analyser-v1.mjs
          node scripts/verify-prompt-promotion-v1.mjs
          node scripts/verify-prompt-library-shards-v1.mjs
          node scripts/verify-daily-library-cutover-v1.mjs
          node scripts/verify-daily-semantic-diversity-v1.mjs
          node scripts/verify-weekly-certified-snapshot-race.mjs
          node scripts/verify-all-season-certification-gate.mjs
          node scripts/check-historical-safe-prompt-pack.mjs
          node scripts/audit-refinement-incubator.mjs
          node --check js/admin-core.js
          node --check js/studio-bootstrap.js
          node --check js/asset-manifest.js
          node --check scripts/promote-refinement-survivors.mjs
          git diff --check

      - name: Verify retired branch is physically absent
        run: |
          set -euo pipefail
          test ! -e js/prompt-studio-loader.js
          test ! -e js/career-overlap-wording.js
          test ! -e js/admin-studio-finish.js
          ! grep -q 'id="dailyHistoryCompatibility"' fragments/admin-daily-workspace.html
          ! grep -q 'id="dailyHistoryCompatibility"' admin.html
          ! grep -q 'recordHistoryBtn' js/admin-core.js
          grep -q 'recordBatchChallenges' js/admin-core.js
          grep -q 'getCooldownPromptIds' js/admin-core.js

      - name: Commit pass 4 production cleanup
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git reset scripts/apply-cleanup-relevance-pass4.py .github/workflows/apply-cleanup-relevance-pass4.yml
          if git diff --cached --quiet; then
            echo 'No pass 4 production changes to commit.'
            exit 0
          fi
          git commit -m 'Retire hidden history UI and disconnected Studio loaders'
          git push origin HEAD:cleanup-relevance-pass4
