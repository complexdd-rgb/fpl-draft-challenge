name: Debug 1996-97 FootballSquads

on:
  push:
    branches:
      - harvest-1996-97-six-clubs
    paths:
      - scripts/debug-1996-97-footballsquads.mjs
      - .github/workflows/debug-1996-97-footballsquads.yml

permissions:
  contents: write

jobs:
  debug:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: harvest-1996-97-six-clubs
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node scripts/debug-1996-97-footballsquads.mjs
      - name: Commit debug html
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/recovery/1996-97/arsenal-footballsquads-debug.html
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Capture 1996-97 FootballSquads markup sample'
          git push origin HEAD:harvest-1996-97-six-clubs
