name: Compact 1996-97 harvest

on:
  push:
    branches:
      - harvest-1996-97-six-clubs
    paths:
      - scripts/compact-1996-97-harvest.mjs
      - .github/workflows/compact-1996-97-harvest.yml

permissions:
  contents: write

jobs:
  compact:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: harvest-1996-97-six-clubs
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node scripts/compact-1996-97-harvest.mjs
      - name: Commit compact harvest
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/recovery/1996-97/statbunker-six-club-compact.csv
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Add compact 1996-97 StatBunker harvest'
          git push origin HEAD:harvest-1996-97-six-clubs
