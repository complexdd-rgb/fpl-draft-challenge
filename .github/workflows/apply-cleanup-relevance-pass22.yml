name: Apply cleanup relevance pass 22

on:
  push:
    branches:
      - cleanup-relevance-pass22
    paths:
      - '.github/workflows/apply-cleanup-relevance-pass22.yml'
      - 'scripts/apply-cleanup-relevance-pass22.mjs'

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: cleanup-relevance-pass22
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Apply CSS cleanup
        run: node scripts/apply-cleanup-relevance-pass22.mjs

      - name: Verify production diff
        run: |
          ! grep -q 'Phase 5: name-rule starters' admin-base.css
          ! grep -q 'name-rule-presets' admin-base.css
          ! grep -q 'name-preset-buttons' admin-base.css
          ! grep -q 'Phase 6 — Publishing Centre' admin-base.css
          ! grep -q 'publish-centre' admin-base.css
          ! grep -q 'publish-checklist-head' admin-base.css
          ! grep -q 'publish-pack-panel' admin-base.css
          grep -q 'Phase 7 — Player Database Auditor' admin-base.css
          grep -q 'database-auditor' admin-base.css
          grep -q 'admin-base.css?v=16.2.2' admin.css
          git diff --check

      - name: Commit production cleanup
        run: |
          if git diff --quiet -- admin-base.css admin.css; then
            echo 'No production cleanup changes to commit.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add admin-base.css admin.css
          git commit -m 'Prune retired name-rule and publishing CSS'
          git push origin HEAD:cleanup-relevance-pass22
