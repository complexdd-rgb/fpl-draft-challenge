name: Apply Generator v3 immediate runtime replacement
on:
  push:
    branches: [fix/generator-v3-immediate-runtime-replacement]
    paths:
      - 'scripts/apply-generator-v3-immediate-runtime-replacement.py'
      - '.github/workflows/apply-generator-v3-immediate-runtime-replacement.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply Generator v3.0.2 patch
        run: python3 scripts/apply-generator-v3-immediate-runtime-replacement.py
      - name: Rebuild Studio wiring
        run: |
          node scripts/build-asset-manifest-runtime.mjs
          node scripts/build-studio-cache-tags.mjs
      - name: Verify Generator v3.0.2
        run: |
          node --check js/admin-daily-generator-guard.js
          node scripts/verify-weekly-certified-snapshot-race.mjs
          node scripts/verify-weekly-top-answer-diversity.mjs
          node scripts/verify-daily-semantic-diversity-v1.mjs
          node scripts/verify-daily-curated-authority-v1.mjs
          node scripts/verify-all-season-certification-gate.mjs
          node scripts/verify-daily-library-cutover-v1.mjs
          node scripts/verify-prompt-studio-clean-reset.mjs
      - name: Commit patch
        run: |
          rm -f scripts/apply-generator-v3-immediate-runtime-replacement.py .github/workflows/apply-generator-v3-immediate-runtime-replacement.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Replace invalid Generator v3 candidates in place' || exit 0
          git push
