name: Studio Architecture Verification

on:
  pull_request:
    paths:
      - 'config/asset-manifest.json'
      - 'js/asset-manifest.js'
      - 'js/studio-bootstrap.js'
      - 'js/admin-import-tools.js'
      - 'js/prompt-studio-clean-reset.js'
      - 'js/repository-certified-prompt-pool.js'
      - 'prompt-library.js'
      - 'scripts/verify-prompt-studio-clean-reset.mjs'
      - 'js/admin-stage-one.js'
      - 'js/validation-engine.js'
      - 'fragments/admin-daily-workspace.html'
      - '.github/workflows/studio-wiring.yml'
  push:
    branches:
      - main
      - 'prompt-studio-*'
    paths:
      - 'config/asset-manifest.json'
      - 'js/asset-manifest.js'
      - 'js/studio-bootstrap.js'
      - 'js/admin-import-tools.js'
      - 'js/prompt-studio-clean-reset.js'
      - 'js/repository-certified-prompt-pool.js'
      - 'prompt-library.js'
      - 'scripts/verify-prompt-studio-clean-reset.mjs'
      - '.github/workflows/studio-wiring.yml'

permissions:
  contents: read

concurrency:
  group: studio-architecture-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Verify Prompt Studio clean reset boundary
        run: node scripts/verify-prompt-studio-clean-reset.mjs

      - name: Verify unaffected native workspaces
        run: |
          node scripts/verify-native-validation-workspace.mjs
          node scripts/verify-native-daily-workspace.mjs

      - name: Check reset JavaScript syntax
        run: |
          node --check js/asset-manifest.js
          node --check js/studio-bootstrap.js
          node --check js/admin-import-tools.js
          node --check js/prompt-studio-clean-reset.js
          node --check js/repository-certified-prompt-pool.js
          node --check scripts/verify-prompt-studio-clean-reset.mjs

      - name: Reject whitespace errors
        run: git diff --check origin/main...HEAD
