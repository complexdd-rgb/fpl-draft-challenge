name: Studio Architecture Verification

on:
  pull_request:
    paths:
      - 'config/asset-manifest.json'
      - 'js/asset-manifest.js'
      - 'js/studio-bootstrap.js'
      - 'js/admin-import-tools.js'
      - 'js/prompt-studio-clean-reset.js'
      - 'js/prompt-factory-mount-v1.js'
      - 'js/prompt-factory-v1.js'
      - 'js/prompt-quality-analyser-mount-v1.js'
      - 'js/prompt-quality-analyser-v1.js'
      - 'js/prompt-promotion-v1.js'
      - 'js/prompt-library-shards-v1.js'
      - 'js/prompt-library-shards-promotion-bridge-v1.js'
      - 'js/admin-daily-library-cutover-v1.js'
      - 'js/admin-schedule-manager-v2.js'
      - 'admin-prompt-studio-clean.css'
      - 'admin-prompt-quality-analyser.css'
      - 'admin-prompt-promotion-v1.css'
      - 'admin-prompt-library-shards-v1.css'
      - 'js/repository-certified-prompt-pool.js'
      - 'prompt-library.js'
      - 'scripts/verify-prompt-studio-clean-reset.mjs'
      - 'scripts/verify-prompt-factory-v1.mjs'
      - 'scripts/verify-prompt-quality-analyser-v1.mjs'
      - 'scripts/verify-prompt-promotion-v1.mjs'
      - 'scripts/verify-prompt-library-shards-v1.mjs'
      - 'scripts/verify-daily-library-cutover-v1.mjs'
      - 'scripts/materialise-prompt-library-shards.mjs'
      - 'scripts/build-asset-manifest-runtime.mjs'
      - 'scripts/build-studio-cache-tags.mjs'
      - 'scripts/build-native-daily-workspace.mjs'
      - 'js/admin-stage-one.js'
      - 'js/validation-engine.js'
      - 'fragments/admin-daily-workspace.html'
      - 'scripts/verify-native-daily-workspace.mjs'
      - 'admin.html'
      - '.github/workflows/studio-wiring.yml'
  push:
    branches:
      - main
      - 'prompt-studio-*'
      - 'redesign/daily-challenge-studio-v1'
    paths:
      - 'config/asset-manifest.json'
      - 'js/asset-manifest.js'
      - 'js/studio-bootstrap.js'
      - 'js/admin-import-tools.js'
      - 'js/prompt-studio-clean-reset.js'
      - 'js/prompt-factory-mount-v1.js'
      - 'js/prompt-factory-v1.js'
      - 'js/prompt-quality-analyser-mount-v1.js'
      - 'js/prompt-quality-analyser-v1.js'
      - 'js/prompt-promotion-v1.js'
      - 'js/prompt-library-shards-v1.js'
      - 'js/prompt-library-shards-promotion-bridge-v1.js'
      - 'js/admin-daily-library-cutover-v1.js'
      - 'js/admin-schedule-manager-v2.js'
      - 'admin-prompt-studio-clean.css'
      - 'admin-prompt-quality-analyser.css'
      - 'admin-prompt-promotion-v1.css'
      - 'admin-prompt-library-shards-v1.css'
      - 'js/repository-certified-prompt-pool.js'
      - 'prompt-library.js'
      - 'scripts/verify-prompt-studio-clean-reset.mjs'
      - 'scripts/verify-prompt-factory-v1.mjs'
      - 'scripts/verify-prompt-quality-analyser-v1.mjs'
      - 'scripts/verify-prompt-promotion-v1.mjs'
      - 'scripts/verify-prompt-library-shards-v1.mjs'
      - 'scripts/verify-daily-library-cutover-v1.mjs'
      - 'scripts/materialise-prompt-library-shards.mjs'
      - 'scripts/build-asset-manifest-runtime.mjs'
      - 'scripts/build-studio-cache-tags.mjs'
      - 'scripts/build-native-daily-workspace.mjs'
      - 'fragments/admin-daily-workspace.html'
      - 'scripts/verify-native-daily-workspace.mjs'
      - 'admin.html'
      - '.github/workflows/studio-wiring.yml'

permissions:
  contents: write

concurrency:
  group: studio-architecture-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Refresh manifest-owned Daily Studio wiring on branch pushes
        if: github.event_name == 'push'
        run: |
          node scripts/build-asset-manifest-runtime.mjs
          node scripts/build-native-daily-workspace.mjs
          node scripts/build-studio-cache-tags.mjs

      - name: Commit refreshed Daily Studio wiring
        if: github.event_name == 'push'
        shell: bash
        run: |
          set -euo pipefail
          git add admin.html js/asset-manifest.js
          if git diff --cached --quiet; then
            echo 'Daily Studio wiring is already current.'
          else
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git commit -m 'Refresh Daily Studio wiring'
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi

      - name: Verify Prompt Studio clean architecture boundary
        run: node scripts/verify-prompt-studio-clean-reset.mjs

      - name: Run Prompt Factory behavioural smoke test
        run: node scripts/verify-prompt-factory-v1.mjs

      - name: Run Prompt Quality Analyser behavioural smoke test
        run: node scripts/verify-prompt-quality-analyser-v1.mjs

      - name: Run Prompt Promotion behavioural smoke test
        run: node scripts/verify-prompt-promotion-v1.mjs

      - name: Run Prompt Library Shards behavioural smoke test
        run: node scripts/verify-prompt-library-shards-v1.mjs

      - name: Run Daily library cutover boundary smoke test
        run: node scripts/verify-daily-library-cutover-v1.mjs

      - name: Verify unaffected native workspaces
        run: |
          node scripts/verify-native-validation-workspace.mjs
          node scripts/verify-native-daily-workspace.mjs

      - name: Check clean runtime JavaScript syntax
        run: |
          node --check js/asset-manifest.js
          node --check js/studio-bootstrap.js
          node --check js/admin-import-tools.js
          node --check js/prompt-studio-clean-reset.js
          node --check js/prompt-factory-mount-v1.js
          node --check js/prompt-factory-v1.js
          node --check js/prompt-quality-analyser-mount-v1.js
          node --check js/prompt-quality-analyser-v1.js
          node --check js/prompt-promotion-v1.js
          node --check js/prompt-library-shards-v1.js
          node --check js/prompt-library-shards-promotion-bridge-v1.js
          node --check js/admin-daily-library-cutover-v1.js
          node --check js/admin-schedule-manager-v2.js
          node --check js/repository-certified-prompt-pool.js
          node --check scripts/verify-prompt-studio-clean-reset.mjs
          node --check scripts/verify-prompt-factory-v1.mjs
          node --check scripts/verify-prompt-quality-analyser-v1.mjs
          node --check scripts/verify-prompt-promotion-v1.mjs
          node --check scripts/verify-prompt-library-shards-v1.mjs
          node --check scripts/verify-daily-library-cutover-v1.mjs
          node --check scripts/materialise-prompt-library-shards.mjs
          node --check scripts/build-asset-manifest-runtime.mjs
          node --check scripts/build-studio-cache-tags.mjs
          node --check scripts/build-native-daily-workspace.mjs

      - name: Reject whitespace errors
        run: git diff --check origin/main...HEAD
