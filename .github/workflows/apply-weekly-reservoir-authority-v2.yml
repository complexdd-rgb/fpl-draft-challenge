name: Apply weekly reservoir authority v2

on:
  push:
    branches:
      - daily-nationality-rotation-bridge-v1
    paths:
      - 'scripts/apply-weekly-reservoir-authority-v2.py'
      - '.github/workflows/apply-weekly-reservoir-authority-v2.yml'

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Apply reservoir authority patch
        run: python scripts/apply-weekly-reservoir-authority-v2.py

      - name: Rebuild generated asset wiring
        run: |
          node scripts/build-asset-manifest-runtime.mjs
          node scripts/build-studio-cache-tags.mjs

      - name: Verify weekly reservoir authority
        run: |
          node --check js/admin-batch-calendar.js
          node --check js/admin-daily-generator-guard.js
          node --check scripts/verify-weekly-certified-snapshot-race.mjs
          node scripts/verify-weekly-certified-snapshot-race.mjs
          node scripts/verify-daily-semantic-diversity-v1.mjs
          node scripts/verify-prompt-studio-clean-reset.mjs
          node scripts/verify-all-season-certification-gate.mjs
          git diff --check

      - name: Commit runtime fix
        shell: bash
        run: |
          set -euo pipefail
          git add -A
          if git diff --cached --quiet; then
            echo 'Reservoir authority fix is already current.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Make certified reservoir authoritative for weekly prompt rotation'
          git push origin "HEAD:${GITHUB_REF_NAME}"
