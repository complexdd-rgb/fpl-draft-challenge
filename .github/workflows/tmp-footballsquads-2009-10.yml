name: Temporary FootballSquads 2009-10 Extraction

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/tmp-footballsquads-2009-10.yml'
  workflow_dispatch:

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - name: Extract 2009-10 FootballSquads Premier League squads
        shell: bash
        run: |
          set -e
          python -m pip install --quiet requests beautifulsoup4
          python - <<'PY'
          import csv, re, time
          from urllib.parse import urljoin
          import requests
          from bs4 import BeautifulSoup

          base = 'https://www.footballsquads.co.uk/eng/2009-2010/faprem.htm'
          s = requests.Session()
          s.headers.update({'User-Agent':'Mozilla/5.0'})
          r = s.get(base, timeout=30)
          r.raise_for_status()
          soup = BeautifulSoup(r.text, 'html.parser')
          links = []
          for a in soup.find_all('a', href=True):
              href = a['href']
              if href.lower().endswith('.htm') and 'faprem/' in href.lower():
                  url = urljoin(base, href)
                  if url not in links:
                      links.append(url)
          if len(links) != 20:
              raise SystemExit(f'Expected 20 club links, found {len(links)}: {links}')

          rows=[]
          for url in links:
              rr=s.get(url,timeout=30); rr.raise_for_status()
              ss=BeautifulSoup(rr.text,'html.parser')
              h2=ss.find(['h1','h2'])
              club=(h2.get_text(' ',strip=True) if h2 else url.rsplit('/',1)[-1].split('.')[0])
              found=False
              for table in ss.find_all('table'):
                  trs=table.find_all('tr')
                  if not trs: continue
                  header=[x.get_text(' ',strip=True) for x in trs[0].find_all(['th','td'])]
                  hl=[x.lower() for x in header]
                  if 'name' not in hl or 'pos' not in hl:
                      continue
                  idx={x.lower():i for i,x in enumerate(header)}
                  for tr in trs[1:]:
                      cells=[x.get_text(' ',strip=True) for x in tr.find_all(['th','td'])]
                      if len(cells) < len(header):
                          continue
                      name=cells[idx['name']].strip()
                      if not name:
                          continue
                      rows.append({
                          'club':club,
                          'number':cells[idx.get('number',0)].strip() if idx.get('number',0)<len(cells) else '',
                          'name':name,
                          'nat':cells[idx['nat']].strip() if 'nat' in idx else '',
                          'pos':cells[idx['pos']].strip() if 'pos' in idx else '',
                          'height':cells[idx['height']].strip() if 'height' in idx else '',
                          'weight':cells[idx['weight']].strip() if 'weight' in idx else '',
                          'date_of_birth':cells[idx['date of birth']].strip() if 'date of birth' in idx else '',
                          'birth_place':cells[idx['birth place']].strip() if 'birth place' in idx else '',
                          'previous_club':cells[idx['previous club']].strip() if 'previous club' in idx else '',
                          'source_url':url,
                      })
                  found=True
                  break
              if not found:
                  raise SystemExit(f'No squad table found for {url}')
              time.sleep(0.2)

          with open('footballsquads_2009_10.csv','w',newline='',encoding='utf-8-sig') as f:
              w=csv.DictWriter(f,fieldnames=['club','number','name','nat','pos','height','weight','date_of_birth','birth_place','previous_club','source_url'])
              w.writeheader(); w.writerows(rows)
          with open('footballsquads_2009_10_summary.txt','w',encoding='utf-8') as f:
              f.write(f'clubs={len(set(r["club"] for r in rows))}\n')
              f.write(f'rows={len(rows)}\n')
              for club in sorted(set(r['club'] for r in rows)):
                  f.write(f'{club}: {sum(1 for r in rows if r["club"]==club)}\n')
          print('clubs',len(set(r['club'] for r in rows)),'rows',len(rows))
          PY
      - name: Upload extraction
        uses: actions/upload-artifact@v4
        with:
          name: footballsquads-2009-10
          path: |
            footballsquads_2009_10.csv
            footballsquads_2009_10_summary.txt
