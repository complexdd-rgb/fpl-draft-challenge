name: Prompt Curation

on:
  pull_request:
    paths:
      - 'PROMPT_CURATION_POLICY.md'
      - 'PROJECT_ROADMAP.md'
      - 'scripts/audit-prompt-curation-v1.mjs'
      - 'scripts/verify-prompt-curation-v1.mjs'
      - 'scripts/verify-prompt-curation-review-export-v1.mjs'
      - 'scripts/verify-prompt-curation-evidence-v1.mjs'
      - 'scripts/verify-prompt-curation-survivor-builder-v1.mjs'
      - 'scripts/verify-prompt-curation-freeze-v12.mjs'
      - 'js/prompt-curation-review-export-v1.js'
      - 'js/prompt-curation-evidence-v1.js'
      - 'js/prompt-curation-survivor-builder-v1.js'
      - 'js/studio-bootstrap.js'
      - 'config/asset-manifest.json'
      - 'js/asset-manifest.js'
      - 'admin.html'
      - 'reports/prompt-curation-phase1-baseline.md'
      - 'reports/prompt-curation-134765-full-evidence.md'
      - 'reports/prompt-curation-134765-survivor-v12-freeze-audit.md'
      - 'reports/prompt-curation-134765-survivor-v12-freeze-manifest.json'
      - '.github/workflows/prompt-curation.yml'
  push:
    branches: [main]
    paths:
      - 'PROMPT_CURATION_POLICY.md'
      - 'PROJECT_ROADMAP.md'
      - 'scripts/audit-prompt-curation-v1.mjs'
      - 'scripts/verify-prompt-curation-v1.mjs'
      - 'scripts/verify-prompt-curation-review-export-v1.mjs'
      - 'scripts/verify-prompt-curation-evidence-v1.mjs'
      - 'scripts/verify-prompt-curation-survivor-builder-v1.mjs'
      - 'scripts/verify-prompt-curation-freeze-v12.mjs'
      - 'js/prompt-curation-review-export-v1.js'
      - 'js/prompt-curation-evidence-v1.js'
      - 'js/prompt-curation-survivor-builder-v1.js'
      - 'js/studio-bootstrap.js'
      - 'config/asset-manifest.json'
      - 'js/asset-manifest.js'
      - 'admin.html'
      - 'reports/prompt-curation-phase1-baseline.md'
      - 'reports/prompt-curation-134765-full-evidence.md'
      - 'reports/prompt-curation-134765-survivor-v12-freeze-audit.md'
      - 'reports/prompt-curation-134765-survivor-v12-freeze-manifest.json'
      - '.github/workflows/prompt-curation.yml'

permissions:
  contents: read

concurrency:
  group: prompt-curation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Verify prompt curation audit and review-batch invariants
        run: node scripts/verify-prompt-curation-v1.mjs

      - name: Verify browser review-export invariants
        run: node scripts/verify-prompt-curation-review-export-v1.mjs

      - name: Verify full-library evidence invariants
        run: node scripts/verify-prompt-curation-evidence-v1.mjs

      - name: Verify survivor proposal hard-collapse invariants
        run: node scripts/verify-prompt-curation-survivor-builder-v1.mjs

      - name: Verify frozen v1.2 survivor decision
        run: node scripts/verify-prompt-curation-freeze-v12.mjs

      - name: Confirm curation tooling stays outside Daily generation authority
        shell: bash
        run: |
          set -euo pipefail
          ! grep -q 'audit-prompt-curation-v1' js/studio-bootstrap.js
          ! grep -q 'audit-prompt-curation-v1' config/asset-manifest.json
          grep -q 'promptCurationEvidenceV1' config/asset-manifest.json
          grep -q 'promptCurationSurvivorBuilderV1' config/asset-manifest.json
          grep -q 'promptCurationReviewExportV1' config/asset-manifest.json
          grep -q 'ensureCurationEvidence();' js/studio-bootstrap.js
          grep -q 'ensureCurationSurvivorBuilder' js/studio-bootstrap.js
          grep -q 'ensureCurationReview();' js/studio-bootstrap.js
          grep -q 'ensureDailyCutover();' js/studio-bootstrap.js
          grep -q 'does not alter Promotion, saved shards, Daily generation or publishing' js/prompt-curation-evidence-v1.js
          grep -q 'This does not alter Promotion, saved shards, Daily generation or publishing.' js/prompt-curation-survivor-builder-v1.js
          grep -q 'This does not alter Promotion, the saved source snapshot, Daily generation' js/prompt-curation-review-export-v1.js
          ! grep -q 'FPL_DAILY_GENERATION_PROMPT_POOL =' js/prompt-curation-evidence-v1.js
          ! grep -q 'FPL_DAILY_GENERATION_FAMILY_PLAN =' js/prompt-curation-evidence-v1.js
          ! grep -q 'FPL_DAILY_GENERATION_PROMPT_POOL =' js/prompt-curation-survivor-builder-v1.js
          ! grep -q 'FPL_DAILY_GENERATION_FAMILY_PLAN =' js/prompt-curation-survivor-builder-v1.js

      - name: Reject whitespace errors
        run: git diff --check
